# Routes are pinned here (override with CORE_URL / AI_URL / INTERNAL_TOKEN / JWT_MODE).
# JWT: dealer-core issues its own HS256 tokens after password sign-in; gateway and core validate them.
# CORS policy is only in CorsConfig. Do not add spring.cloud.gateway.globalcors.
server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: dealer-gateway
  cloud:
    gateway:
      # dealer-core builds absolute URLs (Swagger servers) from these headers, so
      # they must name the gateway's public origin. Host and Proto come first in each list, which is
      # the value core reads. No X-Forwarded-Port: behind Azure the gateway's internal port would be
      # sent, so core falls back to the scheme default (443); locally Host already carries :8080.
      x-forwarded:
        enabled: true
        host-enabled: true
        proto-enabled: true
        port-enabled: false
      # Backstop if a route omits metadata. Per-route metadata below overrides this.
      # response-timeout here is a duration; route metadata values are milliseconds.
      httpclient:
        connect-timeout: 2000
        response-timeout: 18s
      routes:
        # Image Studio photo uploads and downloads are binary. They skip CacheRequestBody, which
        # decodes the body as a String for request logging and is capped at 256 KB in memory.
        - id: dealer-core-photos
          uri: ${CORE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/vehicles/*/photos,/api/v1/vehicles/*/photos/**
          metadata:
            connect-timeout: 2000
            response-timeout: 18000
        - id: dealer-core-public
          uri: ${CORE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
          # Outer hop for browser calls, including checks that block on core's 13s AI wait.
          # 18s stays under the browser check timeout (20s) and above that nested wait.
          metadata:
            connect-timeout: 2000
            response-timeout: 18000
          # No PreserveHostHeader: Azure App Service routes by Host, so the gateway's own
          # host on a request to dealerops-core is refused with 400. Core reads
          # X-Forwarded-Host instead (forward-headers-strategy: framework).
          filters:
            # A client-supplied X-Dealer-Internal is rejected by InternalRouteFilter before routing.
            - CacheRequestBody=String
        # Proxied for local/dev classroom only. SecurityConfig denies these paths
        # unless dealerops.jwt.mode is dev and no non-local Spring profile is active.
        - id: dealer-core-swagger
          uri: ${CORE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/v1/api-docs,/v1/api-docs/**
          metadata:
            connect-timeout: 2000
            response-timeout: 5000
        - id: ai-service-internal
          uri: ${AI_URL:http://localhost:8082}
          predicates:
            - Path=/internal/v1/**
            # Header values are regular expressions. \Q...\E keeps a base64 token with '+' literal.
            - Header=X-Dealer-Internal, \Q${INTERNAL_TOKEN:dealer-internal}\E
          # Covers ai-service response-timeout-ms (13000) plus a small margin.
          metadata:
            connect-timeout: 2000
            response-timeout: 16000
          filters:
            - CacheRequestBody=String
        - id: not-found
          uri: no://op
          order: 100
          predicates:
            - Path=/**
            - Not=Path=/actuator/health
            - Not=Path=/actuator/health/**
            - Not=Path=/actuator/release
          filters:
            - SetStatus=404

management:
  endpoints:
    web:
      exposure:
        # release lists the release time of gateway, core and ai-service for the web footer.
        include: health,release
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,downstream
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

dealerops:
  # Release time. deploy/terraform/deploy-apps.sh stamps PUBLISHED_AT on every Azure deploy;
  # when it is unset, the Maven build time is used (design/20-Observability.md).
  published-at: ${PUBLISHED_AT:}
  # Relative to the process working directory. Run configurations use the repo root,
  # so all services share one log-sum/ folder. Set LOG_DIR to override per environment.
  log-dir: ${LOG_DIR:log-sum}
  internal-header-name: X-Dealer-Internal
  # PROTOCOL §B.1 default, same literal on gateway, core, and ai-service
  internal-token: ${INTERNAL_TOKEN:dealer-internal}
  # Same as CORS_ALLOWED_ORIGIN. Azure: https SPA origin, not localhost-only.
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    mode: ${JWT_MODE:dev}
    dev-secret: ${DEV_JWT_SECRET:dealer-dev-jwt-secret-change-me}
