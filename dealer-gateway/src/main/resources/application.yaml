# Routes are pinned here (override with CORE_URL / AI_URL / INTERNAL_TOKEN / ENTRA_* / JWT_MODE).
# JWT: JWT_MODE=dev uses local HS256. JWT_MODE=entra uses issuer + audience + JWKS.
# Placeholder ENTRA_ISSUER does not fetch JWKS at startup.
server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: dealer-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER:https://login.microsoftonline.com/<tenant-id>/v2.0}
          audiences: ${ENTRA_AUDIENCE:api://dealer-api}
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              # Local Vite or Azure web HTTPS. Set CORS_ALLOWED_ORIGIN; no hostname in git.
              - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type]
            exposedHeaders: []
            allowCredentials: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: dealer-core-public
          uri: ${CORE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - PreserveHostHeader
        - id: ai-service-internal
          uri: ${AI_URL:http://localhost:8082}
          predicates:
            - Path=/internal/v1/**
            - Header=X-Dealer-Internal, ${INTERNAL_TOKEN:dealer-internal}
          filters:
            - RemoveRequestHeader=Authorization
        - id: not-found
          uri: no://op
          predicates:
            - Path=/**
            - Not=Path=/actuator/health
          filters:
            - SetStatus=404

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

dealerops:
  internal-header-name: X-Dealer-Internal
  # PROTOCOL §B.1 default, same literal on gateway, core, and ai-service
  internal-token: ${INTERNAL_TOKEN:dealer-internal}
  # Same as CORS_ALLOWED_ORIGIN. Azure: https SPA origin, not localhost-only.
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    mode: ${JWT_MODE:dev}
    dev-secret: ${DEV_JWT_SECRET:dealer-dev-jwt-secret-change-me}
    jwks-uri: ${ENTRA_JWKS_URI:}
