# Local-only APM backend for developer tracing/debugging (design/20-Observability.md).
# Not part of the Azure/Terraform deploy; does not affect the graded environment.
# Start: docker compose -f deploy/skywalking/docker-compose.yml up -d
services:
  oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: dealerops-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800" # gRPC: Java agents report here (SW_AGENT_COLLECTOR_BACKEND_SERVICES)
      - "12800:12800" # HTTP: queried by the UI
    environment:
      SW_STORAGE: h2 # in-memory/local storage; no Elasticsearch for classroom scope

  ui:
    image: apache/skywalking-ui:9.7.0
    container_name: dealerops-skywalking-ui
    restart: unless-stopped
    depends_on:
      - oap
    ports:
      - "8088:8080"
    environment:
      SW_OAP_ADDRESS: http://oap:12800
