# Acceptance overlay for images already pushed to GHCR.
# Does not replace source builds. From dealer-platform:
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up --no-build --pull always
# The --no-build flag keeps Compose from rebuilding and retagging the GHCR image.
# Login is required when the packages are private: docker login ghcr.io
# Do not set PUBLISHED_AT here. The core image already carries the workflow timestamp.

services:
  dealer-core:
    image: ghcr.io/yuandong-yang/dealer-core:main
    pull_policy: always
  ai-service:
    image: ghcr.io/yuandong-yang/ai-service:main
    pull_policy: always
  dealer-gateway:
    image: ghcr.io/yuandong-yang/dealer-gateway:main
    pull_policy: always
  dealer-web:
    image: ghcr.io/yuandong-yang/dealer-web:main
    pull_policy: always
