openapi: 3.0.3
info:
  title: DealerOps Gateway API
  version: "6.0"
  description: |
    Current HTTP JSON is defined by `design/14-Backend-API-Contract.md`. This file is for coding AIs generating Controllers / clients.

    **Entry:** browsers and external clients call only Gateway `http://localhost:8080`, prefix `/api/v1/**`.
    core=8081 and ai-service=8082 are not public. Bypassing the Gateway must fail.

    **Internal:** `/internal/v1/**` tagged `Internal` with `x-internal: true` is only core calling ai-service directly at `AiService:BaseUrl` with the `X-Dealer-Internal` header.
    Browsers cannot reach these paths: the Gateway returns **404** (not 401) when the internal header is missing, so the path is not acknowledged.
    Internal AI **success/failure JSON** is pinned by `design/AI-PROTOCOL-AND-RULES.md` §B.2–B.3 (`{success,notes[]}` and `{success,summary}`). That protocol wins over older OpenAPI or 14 §11 wording that only said “notes” / “short text”.

    **Tenant / auth (behavior aligned with 15; fields still come only from 14):**
    - Anonymous: `POST /api/v1/auth/login`, `/auth/register`, `/auth/google`, `/auth/firebase`, every `GET /api/v1/catalog/**` (makes, models, VIN decode, public dealer directory), and the Gateway's own `GET /actuator/release`. Login accepts an email, username, or phone as `identifier`; the sign-in routes return a DealerOps HS256 `accessToken` (claims `sub`=username, `name`, `roles`); every other `/api/v1` operation needs `Authorization: Bearer <accessToken>`.
    - Roles are only `Platform.Admin` and `Dealer.User`. Ignore client `dealerId` in body / query / header.
    - Staff tenant comes only from the JWT `sub` (the username) → exactly one `membership.active=1` row.
    - Cross-dealership or unknown id in this dealership → **404** `NOT_FOUND` (anti-probing; not 403).
    - Platform.Admin may call only `/api/v1/me`, `/api/v1/admin/**`, and the anonymous routes. Admin hitting any business URL, staff hitting Admin URLs, or staff without valid membership calling business APIs → **403** `FORBIDDEN`.
    - `/me` (GET, PATCH, DELETE) still works when authenticated with no dealership (`dealerId=null`). Every other authenticated route returns **403** for an unbound Dealer.User.
    - Writes that carry `version` must match the current row, otherwise **409** `VERSION_CONFLICT`.
    - Unlink `DELETE .../vehicles/{vehicleId}` → **204**. Sold vehicles cannot be unlinked → **409** `SOLD_LOCKED`.
    - Ad check Blocked / Needs AI / Passed → **200** (Blocked is not an HTTP error). Rules passed but AI failed → **502** `AI_UNAVAILABLE` (check row already written).
    - Any `/api/**` call may return **429** `RATE_LIMITED` with `Retry-After: 60` from the Gateway's per-client limits (anonymous per IP, signed-in per user, AI calls separately; design/19 §1.5.1).

    If public `/api/v1` details conflict, 14 wins. Do not invent business fields that 14 does not define.
    If **internal** AI request/response details conflict, PROTOCOL §B.2–B.3 wins.
  x-conflict-authority: design/14-Backend-API-Contract.md
  x-internal-ai-authority: design/AI-PROTOCOL-AND-RULES.md

servers:
  - url: http://localhost:8080
    description: Gateway only. The only public API origin.

tags:
  - name: Auth
    description: Anonymous sign-in (password, Google, Firebase) and self sign-up
  - name: Me
    description: Current authenticated identity and self-service profile
  - name: Catalog
    description: Anonymous NHTSA vPIC lookups and the public dealer directory
  - name: JoinRequests
    description: Dealer.User approval of Google join requests and the dealer inbox
  - name: Release
    description: Gateway release timestamps (anonymous)
  - name: AdminDealers
    description: Platform.Admin dealership CRUD
  - name: AdminMemberships
    description: Platform.Admin staff membership binding
  - name: Vehicles
    description: Dealer.User vehicle DMS
  - name: Customers
    description: Dealer.User customer CRM
  - name: Link
    description: Link / unlink vehicle
  - name: Listings
    description: One listing draft per vehicle
  - name: Checks
    description: Compliance check, Ready, Export
  - name: Leads
    description: Dealer.User lead follow-up (design/21 §3)
  - name: WorkOrders
    description: Dealer.User reconditioning work orders (design/21 §4)
  - name: Photos
    description: Dealer.User Image Studio vehicle photos (design/21 §6)
  - name: Members
    description: Dealer.User directory of this dealership's active members
  - name: Payments
    description: Dealer.User payment ledger on sold vehicles (design/21 §9, PAY-01–04)
  - name: BuyerSite
    description: Anonymous buyer site (design/21 §9, SHOP-01–05)
  - name: Audit
    description: This-dealership audit query
  - name: Assistant
    description: Staff assistant (does not write business tables)
  - name: Internal
    description: |
      core → ai-service. Not reachable from the browser (404).
      For the core adapter only. Do not generate these client methods as user APIs for the SPA.
      Success JSON is application/json `{success,notes[]}` (ad-check) or `{success,summary}` (assistant), not text/plain.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login
      description: |
        Anonymous. Resolves `identifier`: a value with `@` is an email (case-insensitive); otherwise an active account with that exact username; otherwise a valid phone with country code (spaces, dashes, brackets ignored). Then verifies the BCrypt password hash.
        Unknown identifier, inactive account, or wrong password → **401** `UNAUTHORIZED` with the same message.
        Blank identifier or password → **400** `VALIDATION`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          description: Invalid sign-in name or password. code=`UNAUTHORIZED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHORIZED
                message: Invalid sign-in name or password

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a local account
      description: Anonymous. Creates an unbound Dealer.User account; an administrator must bind it to a dealership before business access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password]
              anyOf:
                - required: [email]
                - required: [phone]
              properties:
                username:
                  type: string
                  pattern: "^(?=.*[A-Za-z])[A-Za-z0-9._-]{3,64}$"
                  description: Sign-in name; 3–64 letters, digits, dots, dashes, or underscores with at least one letter.
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Email and/or phone is required (at least one); either can be used to sign in.
                phone:
                  type: string
                  maxLength: 40
                  description: International phone with country code (7–15 digits, first digit not 0; spaces, dashes, dots, and brackets ignored; stored as `+digits`). Email and/or phone is required (at least one).
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "201":
          description: Registered DealerOps session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "409":
          description: A value is already registered. code is `USERNAME_TAKEN`, `DISPLAY_NAME_TAKEN`, `EMAIL_TAKEN`, or `PHONE_TAKEN`; `fieldErrors` names every taken field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/google:
    post:
      tags: [Auth]
      operationId: googleSignIn
      summary: Google sign-in
      description: |
        Anonymous. Verifies a Google ID token server-side (RS256, issuer, audience, expiry, `email_verified`).
        The account is matched by Google subject, then by email. A Dealer.User always gets `status=ok` with a
        session, bound or not; a missing account is created unbound with no password hash. An unbound account
        files its join request from the no-access page (`POST /api/v1/me/join-request`). An optional `dealerId`
        records that request in the same call when the account has none pending; an unknown or inactive
        `dealerId` is ignored. A Platform.Admin email → **403**.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: Session for the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          description: Invalid token, or email not verified with Google. code=`UNAUTHORIZED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Platform.Admin email, or hosted-domain mismatch. code=`FORBIDDEN`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Derived account values collide. code is `USERNAME_TAKEN`, `DISPLAY_NAME_TAKEN`, or `EMAIL_TAKEN`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Google signing keys unreachable. code=`INTERNAL_ERROR`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/firebase:
    post:
      tags: [Auth]
      operationId: firebaseSignIn
      summary: Firebase email/password sign-in or sign-up
      description: |
        Anonymous. Firebase owns the password; DealerOps owns the account, role, and membership.
        The account is matched by Firebase uid, then by email. Unverified emails are accepted, but an existing
        email account is linked on first use only when the token has `email_verified=true` (else 409 `EMAIL_TAKEN`).
        No match creates an unbound Dealer.User (no password hash) from the optional `username`, `displayName`, and `phone`;
        business calls then return **403** until an administrator binds it. A Platform.Admin match → **403**.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseSignInRequest"
      responses:
        "200":
          description: Signed in (existing or newly created account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          description: Token rejected, no email on the token, or email not verified. code=`UNAUTHORIZED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Platform.Admin account. code=`FORBIDDEN`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: New account values collide (`USERNAME_TAKEN`, `DISPLAY_NAME_TAKEN`, `EMAIL_TAKEN`, `PHONE_TAKEN`), or an unverified email matches an existing account not yet linked to this uid (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Firebase signing keys unreachable. code=`INTERNAL_ERROR`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user
      description: Any authenticated user. For Admin, `dealerId`, `dealerLegalName`, the three `dealerContact*` fields, and `dealerLogoDataUrl` are null. Staff without valid membership still get 200 with `dealerId=null`.
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Me]
      operationId: patchMe
      summary: Update own display name and phone
      description: |
        Username, role, email, and dealership stay fixed. A blank `phone` clears it. Uniqueness is checked against every other account.
        Audited as `APP_USER`/`UPDATE` with `{self:true}`. Works for an unbound Dealer.User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatch"
      responses:
        "200":
          description: Updated identity (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: code is `DISPLAY_NAME_TAKEN` or `PHONE_TAKEN`; `fieldErrors` names the field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete own account (soft delete)
      description: |
        Deactivates the account and its memberships, cancels a pending join request, and frees the email, phone, and Google subject
        for a fresh sign-up. Username and audit history stay. The client must discard its token. Platform.Admin → **403**.
        Audited as `APP_USER`/`DELETE` with `{self:true}`.
      responses:
        "204":
          description: Deleted, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/join-request:
    get:
      tags: [Me]
      operationId: getMyJoinRequest
      summary: The caller's pending join request
      description: Signed-in Dealer.User, including unbound. Platform.Admin → **403**.
      responses:
        "200":
          description: The one pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyJoinRequest"
        "204":
          description: No request is pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Me]
      operationId: fileMyJoinRequest
      summary: Ask one dealership to approve this account (AUTH-25)
      description: |
        An unbound Dealer.User requests one active dealership; repeating the same request is a no-op and
        posts no second notification. A different dealership while one is pending → **400** `VALIDATION`.
        Already a member, or Platform.Admin → **403**. Unknown or inactive dealership → **404**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealerId]
              properties:
                dealerId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyJoinRequest"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dealer/join-requests:
    get:
      tags: [JoinRequests]
      operationId: listJoinRequests
      summary: Pending join requests for the caller's dealership
      description: Dealer.User with a dealership. Active unbound accounts that requested this dealership, newest first. Not paginated.
      responses:
        "200":
          description: Join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/dealer/join-requests/{username}/approve:
    post:
      tags: [JoinRequests]
      operationId: approveJoinRequest
      summary: Approve a join request
      description: |
        Creates or reactivates the membership in the caller's dealership, binds the account, and resolves the
        `JOIN_REQUEST` notification as `APPROVED`. Audited as `MEMBERSHIP`/`CREATE` with `source=join_request`.
        No pending request from that username to this dealership → **404**.
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: Approved, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dealer/join-requests/{username}/reject:
    post:
      tags: [JoinRequests]
      operationId: rejectJoinRequest
      summary: Reject a join request
      description: |
        Clears the requested dealership (the account stays, unbound) and resolves the notification as `REJECTED`.
        Audited as `APP_USER`/`UPDATE`. No pending request → **404**.
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: Rejected, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dealer/notifications:
    get:
      tags: [JoinRequests]
      operationId: listNotifications
      summary: Dealer-wide inbox
      description: |
        Dealer.User with a dealership. Every active member sees the same rows, newest first. Not paginated.
        Default is unresolved rows only; `includeResolved=true` returns the full history.
      parameters:
        - name: includeResolved
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/compliance-rules:
    get:
      tags: [AdminCompliance]
      operationId: listComplianceRules
      summary: Platform-admin compliance rule catalog
      responses:
        "200":
          description: Effective global rule settings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComplianceRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/compliance-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [AdminCompliance]
      operationId: updateComplianceRule
      summary: Configure an existing compliance rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceRuleUpdate" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceRule" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/dealers:
    get:
      tags: [AdminDealers]
      operationId: listDealers
      summary: Dealership list
      parameters:
        - $ref: "#/components/parameters/QLegalName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged dealerships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDealer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AdminDealers]
      operationId: createDealer
      summary: Create dealership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/dealers/{id}:
    parameters:
      - $ref: "#/components/parameters/DealerId"
    get:
      tags: [AdminDealers]
      operationId: getDealer
      summary: One dealership (Admin edit form)
      responses:
        "200":
          description: Dealership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [AdminDealers]
      operationId: patchDealer
      summary: Patch four contact fields, active, and logo
      description: Every field except `logoDataUrl`, including `version` and `active`, is required; a null or missing `logoDataUrl` removes the logo. Ignore body.`id`. There is no `DELETE /admin/dealers/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerPatch"
      responses:
        "200":
          description: Updated dealership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/admin/dealers/{id}/members:
    parameters:
      - $ref: "#/components/parameters/DealerId"
    get:
      tags: [AdminMemberships]
      operationId: listMembers
      summary: Dealership members
      description: Unknown dealership → 404. `q` matches `displayName`, `username`, `email`, or `phone`.
      parameters:
        - $ref: "#/components/parameters/QMember"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AdminMemberships]
      operationId: bindMember
      summary: Bind staff
      description: |
        Already an **active** member of this dealership, still active at another dealership, or the username belongs to a Platform.Admin account → **409** `DUP_MEMBER`.
        Re-binding a previously unbound person reactivates them (not 409). An existing account keeps its own password, display name, and contact fields; only a new account takes them from the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberBind"
      responses:
        "201":
          description: Member item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DUP_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: DUP_MEMBER
                message: Already an active member of this dealership.

  /api/v1/admin/dealers/{id}/members/{username}:
    delete:
      tags: [AdminMemberships]
      operationId: unbindMember
      summary: Unbind staff
      description: Unbind without deleting the `app_user` account. Unknown binding → 404. Success **204** with no body.
      parameters:
        - $ref: "#/components/parameters/DealerId"
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: Unbound, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/dealers/{id}/members/{username}/password:
    put:
      tags: [AdminMemberships]
      operationId: resetMemberPassword
      summary: Reset a staff password
      description: |
        Sets a new password for an active member who forgot theirs; the admin tells the person out of band. Success **204** with no body.
        Only `signInMethod=password` accounts qualify. A Google or Firebase account → **400** `VALIDATION` with a `password` field error, because that provider owns the password.
        No active binding of that username at this dealership → 404. Audit `APP_USER`/`UPDATE` `{username, passwordReset:true}` without the password.
      parameters:
        - $ref: "#/components/parameters/DealerId"
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "204":
          description: Password changed, no body
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/pending-users:
    get:
      tags: [AdminMemberships]
      operationId: listPendingUsers
      summary: Accounts waiting for a dealership
      description: |
        Platform.Admin only. Active Dealer.User accounts with no active membership (self sign-ups,
        unbound former staff), newest first. `q` matches username, display name, email, or phone. Bind one with
        `POST /api/v1/admin/dealers/{id}/members` without a password.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged pending accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePendingUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: This-dealership vehicles
      description: Default `createdAt` descending. Admin → 403. No valid membership → 403.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Substring of VIN / make / model
        - name: make
          in: query
          schema:
            type: string
          description: Exact make, ignoring case
        - name: model
          in: query
          schema:
            type: string
          description: Exact model, ignoring case
        - name: modelYear
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VehicleStatus"
        - name: condition
          in: query
          schema:
            $ref: "#/components/schemas/ConditionCode"
          description: Same as `conditionCode`
        - name: bodyType
          in: query
          schema:
            $ref: "#/components/schemas/VehicleBodyType"
          description: Exact body-type match
        - name: unlinkedOnly
          in: query
          schema:
            type: boolean
            default: false
          description: When true, excludes vehicles linked to any customer
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Intake vehicle
      description: |
        Required: make/model/modelYear/vin/source/purchaseCost/addedOn/conditionCode.
        Ignore `dealerId`, `status`, `soldOn`, `soldPrice`. Server sets `status=IN_STOCK`.
        Duplicate VIN in this dealership → **400** `VIN_DUP`. Audit `VEHICLE`/`CREATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreate"
      responses:
        "201":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: VALIDATION or VIN_DUP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation:
                  value:
                    code: VALIDATION
                    message: Request is invalid.
                vinDup:
                  value:
                    code: VIN_DUP
                    message: VIN already exists in this dealership.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/catalog/makes:
    get:
      tags: [Catalog]
      operationId: listCatalogMakes
      summary: Make options for the DMS filter
      description: Anonymous (Gateway and core permit every `GET /api/v1/catalog/**`). Union of NHTSA vPIC `car` and `mpv` makes, proxied and cached in memory by dealer-core for 12 hours. Sorted, de-duplicated ignoring case.
      security: []
      responses:
        "200":
          description: Make names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "502":
          description: CATALOG_UNAVAILABLE (vPIC unreachable or malformed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/catalog/models:
    get:
      tags: [Catalog]
      operationId: listCatalogModels
      summary: Model options for one make
      description: Anonymous. NHTSA vPIC `GetModelsForMake`, proxied and cached in memory by dealer-core for 12 hours (empty results are cached too). Sorted, de-duplicated ignoring case. An unknown make (empty vPIC result) → **404** `NOT_FOUND`.
      security: []
      parameters:
        - name: make
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: VALIDATION (make missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_FOUND (vPIC has no models for this make)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: CATALOG_UNAVAILABLE (vPIC unreachable or malformed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/catalog/vin/{vin}:
    get:
      tags: [Catalog]
      operationId: decodeVin
      summary: Decode a VIN (public)
      description: NHTSA vPIC `DecodeVinValues`, proxied and cached in memory by dealer-core for 12 hours. Anonymous; used by the landing page and the DMS Add vehicle form. Stores nothing.
      security: []
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"
      responses:
        "200":
          description: Decoded vehicle facts; blank vPIC values are null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VinDecode"
        "400":
          description: VALIDATION (VIN not 17 characters or contains I, O, Q)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_FOUND (vPIC returned no make for this VIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: CATALOG_UNAVAILABLE (vPIC unreachable or malformed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/catalog/dealers:
    get:
      tags: [Catalog]
      operationId: listPublicDealers
      summary: Public dealer directory
      description: Anonymous. Active dealerships sorted by legal name, id and legal name only. Used by the Google sign-in dealership picker.
      security: []
      responses:
        "200":
          description: Active dealerships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicDealer"

  /actuator/release:
    get:
      tags: [Release]
      operationId: getRelease
      summary: Release timestamps (served by the Gateway itself)
      description: Anonymous. The Gateway reads core and ai-service release times with a short timeout; an unreachable service shows `unavailable`. Not proxied to core.
      security: []
      responses:
        "200":
          description: Release times
          content:
            application/json:
              schema:
                type: object
                properties:
                  web: { type: string }
                  gateway: { type: string }
                  core: { type: string }
                  ai: { type: string }

  /api/v1/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: Vehicle detail
      description: Cross-dealership or unknown vehicle → **404**.
      responses:
        "200":
          description: Same as list item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Vehicles]
      operationId: patchVehicle
      summary: Patch purchase/identity whitelist
      description: |
        PATCH must not change `status` / `soldOn` / `soldPrice` (use `/sell`). Ignore `dealerId`.
        Changing purchase fields on a sold vehicle → **409** `SOLD_LOCKED`. Changing VIN on an unsold vehicle still has dealership uniqueness → **400** `VIN_DUP`.
        Changing `conditionCode` increments the matching listing `contentVersion++` when a listing exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiclePatch"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: VALIDATION or VIN_DUP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT or SOLD_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                soldLocked:
                  value:
                    code: SOLD_LOCKED
                    message: Sold vehicles cannot change purchase identity fields.
                version:
                  value:
                    code: VERSION_CONFLICT
                    message: version does not match.
    delete:
      tags: [Vehicles]
      operationId: deleteVehicle
      summary: Soft delete a vehicle while retaining sales and audit history
      description: |
        Sold → **409** `SOLD_LOCKED`. Linked to a customer → **409** `VEHICLE_ALREADY_LINKED` (unlink first).
        Open work orders → **409** `WORK_ORDERS_OPEN`. The deleted vehicle keeps its VIN, so reusing it returns **400** `VIN_DUP`.
      responses:
        "204": { description: Deleted from active inventory }
        "409": { description: "SOLD_LOCKED, VEHICLE_ALREADY_LINKED or WORK_ORDERS_OPEN" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/vehicles/{id}/sell:
    post:
      tags: [Vehicles]
      operationId: sellVehicle
      summary: Sell as a required pair
      description: |
        `soldOn` and `soldPrice` must both be present. Server sets `status=SOLD`.
        Missing either, or `soldPrice` ≤ 0 → **400** `SOLD_PAIR_REQUIRED`. `soldOn` in the future or before `addedOn`
        → **400** `VALIDATION`. Selling again → **409** `SOLD_LOCKED`.
        Open (`OPEN`/`IN_PROGRESS`) work orders → **409** `WORK_ORDERS_OPEN`.
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleSell"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: SOLD_PAIR_REQUIRED or VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SOLD_PAIR_REQUIRED
                message: soldOn and soldPrice are both required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOLD_LOCKED, WORK_ORDERS_OPEN, or VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/vehicles/{vehicleId}/work-orders:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
    get:
      tags: [WorkOrders]
      operationId: listWorkOrders
      summary: Work orders of one vehicle
      description: Open (OPEN, IN_PROGRESS) first, then closed; each group newest first. Works for sold vehicles.
      responses:
        "200":
          description: Work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [WorkOrders]
      operationId: createWorkOrder
      summary: Add a work order to an in-stock vehicle
      description: Sold vehicle → **409** `SOLD_LOCKED`. Assignee must be an active member of this dealership → else **400** `VALIDATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOLD_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/work-orders/{id}:
    patch:
      tags: [WorkOrders]
      operationId: patchWorkOrder
      summary: Change a work order (full editable state)
      description: |
        Transitions OPEN → IN_PROGRESS | DONE | CANCELLED; IN_PROGRESS → DONE | CANCELLED; the same status edits fields.
        DONE requires `completionNote` and `cost` ≥ 0, sets `completedOn`, and adds `cost` to the vehicle `repairCost`
        in the same transaction. Closed → **409** `WORK_ORDER_CLOSED`; other transitions → **400** `VALIDATION`;
        sold vehicle → **409** `SOLD_LOCKED`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: WORK_ORDER_CLOSED, SOLD_LOCKED, or VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/work-orders/report/settlement:
    get:
      tags: [WorkOrders]
      operationId: getWorkshopSettlement
      summary: Tenant-scoped workshop settlement (work-order costs by month and assignee)
      responses:
        "200":
          description: Settlement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopSettlementReport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/vehicles/{vehicleId}/payments:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
    get:
      tags: [Payments]
      operationId: getPaymentLedger
      summary: Payments received for a vehicle and the balance due
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLedger"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Record a payment on a sold vehicle
      description: |
        Records money already received; no card is charged. In-stock vehicle → **400** `VALIDATION`;
        more than the balance due → **400** on `amount`; `paidOn` after today or before the sold date → **400** on `paidOn`.
        Audited as `VEHICLE`/`UPDATE` `{paymentAdded, paymentMethod, paidOn}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Updated ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLedger"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/vehicles/{vehicleId}/payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
      - name: paymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Payments]
      operationId: deletePayment
      summary: Remove a mistaken payment
      description: Audited as `VEHICLE`/`UPDATE` `{paymentRemoved, paidOn}`.
      responses:
        "200":
          description: Updated ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLedger"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/dealers/{dealerId}/inventory:
    parameters:
      - name: dealerId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [BuyerSite]
      operationId: getPublicInventory
      summary: A dealership's listed vehicles
      description: Anonymous. Unknown or inactive dealership → **404**.
      security: []
      responses:
        "200":
          description: Dealership contact and listed vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInventory"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/dealers/{dealerId}/vehicles/{vehicleId}/photo:
    parameters:
      - name: dealerId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - $ref: "#/components/parameters/VehicleIdPath"
    get:
      tags: [BuyerSite]
      operationId: getPublicVehiclePhoto
      summary: First photo of a listed vehicle
      description: Anonymous. The enhanced copy when present. Unlisted vehicle or no photo → **404**.
      security: []
      responses:
        "200":
          description: Image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/dealers/{dealerId}/inquiries:
    parameters:
      - name: dealerId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [BuyerSite]
      operationId: createInquiry
      summary: Ask a dealership about a listed vehicle
      description: |
        Anonymous. Reuses the active customer with the same phone or creates one, then files a NEW lead on the vehicle,
        due today, with the message as its first note (actor `buyer-site`). Field errors use `contact.name`-style keys.
        Unlisted vehicle → **404**. Rate-limited per IP → **429** `RATE_LIMITED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Inquiry"
      responses:
        "204":
          description: Received
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/vehicles/{vehicleId}/photos:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
    get:
      tags: [Photos]
      operationId: listPhotos
      summary: Photo metadata of one vehicle (oldest first, no bytes)
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Photos]
      operationId: uploadPhoto
      summary: Upload a JPEG or PNG photo
      description: |
        At most 2 MB (`PHOTO_MAX_FILE_SIZE`) and 10 photos per vehicle (`PHOTO_MAX_PER_VEHICLE`) → else **400** `VALIDATION`.
        The type is checked from the bytes; anything else → **415** `UNSUPPORTED_MEDIA_TYPE`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: Not a JPEG or PNG image. code=`UNSUPPORTED_MEDIA_TYPE`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/vehicles/{vehicleId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
      - $ref: "#/components/parameters/PhotoId"
    delete:
      tags: [Photos]
      operationId: deletePhoto
      summary: Delete a photo (original and enhanced copy)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/photos/{photoId}/content:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags: [Photos]
      operationId: getPhotoContent
      summary: Image bytes
      description: "`variant=enhanced` before any enhancement → **404**; any other variant value → **400**. `Cache-Control: no-store`."
      parameters:
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [original, enhanced]
            default: original
      responses:
        "200":
          description: Image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/photos/{photoId}/enhance:
    parameters:
      - $ref: "#/components/parameters/VehicleIdPath"
      - $ref: "#/components/parameters/PhotoId"
    post:
      tags: [Photos]
      operationId: enhancePhoto
      summary: Apply an enhancement preset (replaces the enhanced copy; the original never changes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset:
                  $ref: "#/components/schemas/PhotoPreset"
      responses:
        "200":
          description: Enhanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: This-dealership customers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: name / email / phone. A phone-like term (only digits, spaces, `-`, `(`, `)`, `+`, `.`) with 3 or more digits also matches the phone ignoring spaces, `-`, `(`, `)` and `+`.
        - name: linked
          in: query
          schema:
            type: boolean
          description: Whether at least one vehicle is linked
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged customers (list uses linkedVehicle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCustomerListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create customer
      description: "Ignore `dealerId`. Response is the detail (`linkedVehicles: []`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWrite"
      responses:
        "201":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Phone is already used by another customer in this dealership (`PHONE_TAKEN`, `fieldErrors.phone`). A duplicate email is saved and returned as `emailWarning`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Customer detail
      description: Cross-dealership **404**. `linkedVehicles` is the full array.
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: patchCustomer
      summary: Patch the four customer fields
      description: Ignore `dealerId`. Audit `fieldSummary` must not contain full phone/email/home address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPatch"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Version conflict (`VERSION_CONFLICT`), or phone already used by another customer in this dealership (`PHONE_TAKEN`, with `fieldErrors.phone`). A duplicate email is saved and returned as `emailWarning`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Soft delete a customer while retaining sales and audit history
      responses:
        "204": { description: Removed from active CRM lists }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/customers/{id}/vehicles/{vehicleId}:
    put:
      tags: [Link]
      operationId: linkCustomerVehicle
      summary: Link vehicle
      description: |
        No body (or ignore body). Customer and vehicle must be in this dealership and the vehicle not yet linked to any customer.
        `IN_STOCK` and `SOLD` vehicles are both allowed; this route never returns `WRONG_DEALER_OR_SOLD` (14 §6.1).
        Unknown or cross-dealership customer or vehicle id → **404**. Vehicle already linked (including to this customer) → **409** `VEHICLE_ALREADY_LINKED`.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/VehicleIdPath"
      responses:
        "200":
          description: Link row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerVehicleLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VEHICLE_ALREADY_LINKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VEHICLE_ALREADY_LINKED
                message: Vehicle is already linked to a customer.
    delete:
      tags: [Link]
      operationId: unlinkCustomerVehicle
      summary: Unlink
      description: |
        Remove the link between this customer and this vehicle. Do not change vehicle `status`. Success **204** with no body.
        Vehicle `status=SOLD` → **409** `SOLD_LOCKED` (the sale record must not be erased).
        No such link or cross-dealership → **404** (not 403).
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/VehicleIdPath"
      responses:
        "204":
          description: Unbound, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOLD_LOCKED (sold vehicles cannot be unlinked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SOLD_LOCKED
                message: Sold vehicles cannot be unlinked.

  /api/v1/vehicles/{id}/listing:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      tags: [Listings]
      operationId: getVehicleListing
      summary: Get listing draft
      description: |
        No row: **do not insert or persist**. Return a virtual empty draft (`id=null`, `title`/`body`=`""`).
        Cross-dealership vehicle **404**. `lastCheck` is the latest full check object or null.
      responses:
        "200":
          description: listing (virtual or persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      operationId: patchVehicleListing
      summary: Save listing draft
      description: |
        INSERT if no row exists (missing or blank `title`/`body` stored as `''`; missing `adKind`/`medium` default to `CASH`/`ONLINE`).
        On an existing row this is a merge patch: an omitted or null field keeps the stored value; an explicit blank `title`/`body` stores `''`.
        Every save increments `contentVersion` (existing row) and sets `status` back to `DRAFT`.
        First save may omit `version` or send `0`; later saves must send the current `version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingPatch"
      responses:
        "200":
          description: Persisted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/listings/{id}/checks:
    post:
      tags: [Checks]
      operationId: runListingCheck
      summary: Run compliance check
      description: |
        `version` is the listing optimistic lock. Run the fixed checklist first; if there is no hard block, call ai-service `POST /internal/v1/ad-check` (≤15s).
        **Blocked / Needs AI / Passed → HTTP 200** (Blocked is not a 4xx).
        Rules passed but AI timed out or failed → **502** `AI_UNAVAILABLE`; the check row is already written as `UNAVAILABLE`.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Full check object (includes checkStatus). Blocked is still 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "502":
          description: AI_UNAVAILABLE (rules passed, model timed out/failed; check row already written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AI_UNAVAILABLE
                message: Ad check model timed out or failed.

  /api/v1/listings/{id}/ready:
    post:
      tags: [Checks]
      operationId: markListingReady
      summary: Mark Ready
      description: Only when the current check is Passed and not Stale. Success sets listing `status=READY`.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Same as GET listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CHECK_STALE / NOT_PASSED / VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                stale:
                  value:
                    code: CHECK_STALE
                    message: Last passed check does not match listing contentVersion.
                notPassed:
                  value:
                    code: NOT_PASSED
                    message: Listing check is not PASSED.

  /api/v1/listings/{id}/exports:
    post:
      tags: [Checks]
      operationId: exportListing
      summary: Export plain text
      description: |
        Body is the same as ready. Same 409/404.
        Success **200** `text/plain; charset=UTF-8`.
        Content = dealership public four fields + vehicle public fields (year/make/model/vin/condition/source, **no cost**) + title/body + check time. Do not include customers.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Plain-text export
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Type:
              schema:
                type: string
                default: text/plain; charset=UTF-8
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CHECK_STALE / NOT_PASSED / VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: Leads of this dealership (newest first)
      parameters:
        - name: q
          in: query
          description: Customer name contains (case-insensitive)
          schema: { type: string }
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/LeadStage"
        - name: owner
          in: query
          description: Exact owner username
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - name: overdue
          in: query
          description: true = open stage and nextFollowUpOn before today (server date)
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageLeadListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Leads]
      operationId: createLead
      summary: Create a lead (existing customer or new customer)
      description: |
        Exactly one of `customerId` or `newCustomer` → else **400** `VALIDATION`. Owner must be an active member → else **400**.
        Vehicle must be IN_STOCK in this dealership → else **400** `WRONG_DEALER_OR_SOLD`. Starts at NEW; `note` becomes the first note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/report/sales:
    get:
      tags: [Vehicles]
      operationId: getSalesReport
      summary: Tenant-scoped vehicle sales summary (units, revenue, gross profit, months)
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/leads/report/funnel:
    get:
      tags: [Leads]
      operationId: getSalesFunnel
      summary: Current tenant-scoped lead stage distribution
      responses:
        "200":
          description: Stage counts and shares of all leads, open lead count, and won rate over closed leads (won ÷ (won + lost))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesFunnelReport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/leads/{id}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      tags: [Leads]
      operationId: getLead
      summary: Lead detail with notes (newest first)
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Leads]
      operationId: patchLead
      summary: Change a lead (full editable state; null clears a field)
      description: |
        WON and LOST are final → **409** `LEAD_CLOSED`. LOST needs `lostReason` → else **400**; `lostReason` is cleared for other stages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: LEAD_CLOSED or VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/leads/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      tags: [Leads]
      operationId: addLeadNote
      summary: Add a note (closed leads still accept notes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadNote"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/members:
    get:
      tags: [Members]
      operationId: listDealershipMembers
      summary: Active members of the caller's dealership (owner and assignee pickers)
      responses:
        "200":
          description: Members sorted by username
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [username, displayName, source]
                  properties:
                    username: { type: string }
                    displayName: { type: string, description: Falls back to the username }
                    source:
                      $ref: "#/components/schemas/AccountSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Audit
      description: |
        `entityType` and `entityId` are required. Staff see this dealership only; entity not in this dealership → 404.
        Admin → **403** `FORBIDDEN` for every entity type.
        Staff may query `VEHICLE`|`CUSTOMER`|`CUSTOMER_VEHICLE`|`LEAD`|`WORK_ORDER`|`VEHICLE_PHOTO`; `DEALER`/`MEMBERSHIP` → **403**; any other type → **400** `VALIDATION`.
        `CUSTOMER` history also includes the `CUSTOMER_VEHICLE` link/unlink events of that customer.
        `VEHICLE` history also includes the `CUSTOMER_VEHICLE` link/unlink and `VEHICLE_PHOTO` events of that vehicle.
        `fieldSummary` has no full customer phone/email/home address.
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditEntityType"
        - name: entityId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEvent"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/assistant/ask:
    post:
      tags: [Assistant]
      operationId: askAssistant
      summary: Staff assistant
      description: |
        Dealer.User only. Admin → 403. **Does not write** vehicle/customer/listing/check tables.
        Empty `text` → **400** `VALIDATION`.
        Model down: `summary=null`, `summaryAvailable=false`, `cards` remain the retrieval list (max 5), HTTP **200**.
        Cards have no phone, email, or home address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantAsk"
      responses:
        "200":
          description: Short summary plus at most 5 this-dealership resource cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /internal/v1/ad-check:
    post:
      tags: [Internal]
      x-internal: true
      operationId: internalAdCheck
      summary: Internal ad AI check
      description: |
        **Not reachable from the browser (Gateway 404).** Only core calls ai-service (directly, at `AiService:BaseUrl`).
        Do not forward the user JWT to ai-service. `vehiclePublic` has **no** purchase/repair/sold price.
        Request body remains 14 §11 (`listing` + `vehiclePublic` + `dealerPublic`).
        Success body is PROTOCOL §B.2 JSON `{success:true, notes[]}` (not public `aiNotes` only, not business columns).
        core persists `notes` onto the check row as `aiNotes`. Do not invent `recommendation` / `checkStatus` / `ruleFindings`.
        Failure uses the same JSON as assistant: `{success:false, code, message}` with 504/503/502. core maps any failure to public 502 `AI_UNAVAILABLE`.
      security: []
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAdCheckRequest"
      responses:
        "200":
          description: HTTP 200 and `success=true`. `notes` may be `[]`; each item is `{code, severity, explanation, message}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAdCheckOk"
              example:
                success: true
                notes:
                  - code: CLEAR
                    severity: INFO
                    explanation: No additional misleading claims found.
                    message: No additional misleading claims found.
        "502":
          $ref: "#/components/responses/InternalAiProviderFailed"
        "503":
          $ref: "#/components/responses/InternalAiKeyMissing"
        "504":
          $ref: "#/components/responses/InternalAiTimeout"
        "404":
          description: Browser or missing internal header → Gateway/ai-service 404 (do not acknowledge the path)

  /internal/v1/assistant:
    post:
      tags: [Internal]
      x-internal: true
      operationId: internalAssistant
      summary: Internal assistant JSON
      description: |
        **Not reachable from the browser (Gateway 404).** Only core calls ai-service (directly, at `AiService:BaseUrl`).
        Request body remains 14 §11 (`question` + already-filtered `resources`).
        Success body is PROTOCOL §B.3 JSON `{success:true, summary}` (`application/json`, not `text/plain`).
        `summary` is a short non-empty explanation. core re-checks card ids (keep only ids that appeared in this `resources`).
        Failure uses the same JSON shape and HTTP/code table as ad-check. core must not send 502 to the browser; public remains 200 with `summary=null`.
      security: []
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAssistantRequest"
      responses:
        "200":
          description: HTTP 200 and `success=true` with a non-empty `summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAssistantOk"
              example:
                success: true
                summary: Two in-stock Toyotas match. Open a card for DMS.
        "502":
          $ref: "#/components/responses/InternalAiProviderFailed"
        "503":
          $ref: "#/components/responses/InternalAiKeyMissing"
        "504":
          $ref: "#/components/responses/InternalAiTimeout"
        "404":
          description: Browser or missing internal header → 404

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by `POST /api/v1/auth/login`, `/register`, `/google` (status `ok`), or `/firebase`. Missing/bad JWT → 401 `UNAUTHORIZED`.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
      description: Default 10, server cap 10
    QLegalName:
      name: q
      in: query
      schema:
        type: string
      description: Matches legalName
    QMember:
      name: q
      in: query
      schema:
        type: string
      description: Matches displayName, username, email, or phone
    DealerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehicleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LeadId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    InternalToken:
      name: X-Dealer-Internal
      in: header
      required: true
      schema:
        type: string
      description: |
        Internal call header. Browsers must not send it (CORS does not expose it). Missing or wrong header → 404 `{code, message}`.
        Core and ai-service require it on every path. The gateway adds it on the outbound proxy and on its server-side health and OpenAPI fetches, and rejects a client-supplied value on `/api/v1`.
        Not a user JWT. Value comes from env / Key Vault.

  responses:
    Unauthorized:
      description: Missing/bad JWT. code=`UNAUTHORIZED`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Missing or invalid JWT.
    Forbidden:
      description: |
        Role is not allowed on this URL (Admin↔staff hit the wrong prefix), or staff without valid `membership.active=1` called a business API.
        **Not** a cross-dealership case. code=`FORBIDDEN`. Body must not include vin/cost or other business fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: Role or membership does not allow this URL.
    NotFound:
      description: Unknown id in this dealership, or a **cross-dealership id** (anti-probing, not 403). code=`NOT_FOUND`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Resource not found.
    Validation:
      description: Missing field, illegal enum, or bad format. code=`VALIDATION`; may include `fieldErrors`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION
            message: Request is invalid.
            fieldErrors:
              vin: must not be blank
    VersionConflict:
      description: Request `version` does not match the current row. code=`VERSION_CONFLICT`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VERSION_CONFLICT
            message: version does not match.
    InternalAiTimeout:
      description: Internal only (PROTOCOL §B.2). Connect+response timeout. Do not send `AI_TIMEOUT` to the browser.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_TIMEOUT
            message: Model call exceeded 15s.
    InternalAiKeyMissing:
      description: Internal only. `AIMANAGER_API_KEY` missing or blank. Immediate 503; do not wait 15s.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_KEY_MISSING
            message: AIMANAGER_API_KEY is missing or invalid.
    InternalAiProviderFailed:
      description: Internal only. Invalid key, `isSuccess()==false`, parse failure, or vendor error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_PROVIDER_FAILED
            message: Model did not return a usable result.

  schemas:
    ComplianceRule:
      type: object
      required: [ruleId, enabled, severity, message, updatedBy, updatedAt]
      properties:
        ruleId: { type: string }
        enabled: { type: boolean }
        severity: { type: string, enum: [BLOCK, REVIEW] }
        message: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }

    ComplianceRuleUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        severity: { type: string, enum: [BLOCK, REVIEW], nullable: true }
        message: { type: string, maxLength: 500, nullable: true }

    VinDecode:
      type: object
      required: [vin, make]
      properties:
        vin: { type: string }
        make: { type: string }
        model: { type: string, nullable: true }
        modelYear: { type: integer, nullable: true }
        bodyClass: { type: string, nullable: true }
        bodyType:
          allOf:
            - $ref: "#/components/schemas/VehicleBodyType"
          nullable: true
          description: vPIC body class mapped to the DMS body type (unrecognised classes map to OTHER); null when vPIC returns no body class. Used to prefill the create form.
        engine: { type: string, nullable: true, example: "3.0L 6-cyl Gasoline" }
        country: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      description: |
        Standard error body. No SQL, stacks, or raw model text.
        `fieldErrors` is present only when a field is named (`VALIDATION`, and the `*_TAKEN` conflicts).
        Bodies written by the Gateway itself (401/403/404 before core) carry only `code` and `message`.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        requestId:
          type: string
          description: Correlation id of the core request (matches the core log line); may be empty
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: Field name → English message; omitted when there is none

    ErrorCode:
      type: string
      description: |
        | code | HTTP | Meaning |
        |---|---|---|
        | VALIDATION | 400 | Missing field, illegal enum, or bad format |
        | VIN_DUP | 400 | Duplicate VIN in this dealership |
        | SOLD_PAIR_REQUIRED | 400 | Sell missing date or price, or price ≤ 0 |
        | WRONG_DEALER_OR_SOLD | 400 | Lead `vehicleId` not IN_STOCK in this dealership; never returned by PUT link |
        | UNAUTHORIZED | 401 | Not authenticated |
        | FORBIDDEN | 403 | Role not allowed on this URL, or staff has no valid membership |
        | NOT_FOUND | 404 | Missing resource or cross-dealership; also an unknown API path |
        | METHOD_NOT_ALLOWED | 405 | HTTP method not supported on this path |
        | VERSION_CONFLICT | 409 | version mismatch |
        | DUP_MEMBER | 409 | This dealership already has this active member |
        | USERNAME_TAKEN | 409 | Sign-up (password, Google, Firebase) or new member with a username already in use |
        | DISPLAY_NAME_TAKEN | 409 | Sign-up, new member, or `PATCH /me` with a full name already in use (trimmed, case-insensitive) |
        | EMAIL_TAKEN | 409 | Sign-up or new member with an email already in use. Customer email is not rejected; a shared customer email is `emailWarning` on the saved detail |
        | PHONE_TAKEN | 409 | Sign-up, new member, or `PATCH /me` with a phone already in use; or a customer phone already used in this dealership |
        | LEAD_CLOSED | 409 | Change to a WON or LOST lead |
        | WORK_ORDER_CLOSED | 409 | Change to a DONE or CANCELLED work order |
        | WORK_ORDERS_OPEN | 409 | Sell while open work orders exist |
        | VEHICLE_ALREADY_LINKED | 409 | Vehicle already linked to a customer |
        | SOLD_LOCKED | 409 | Sold purchase edit, sell again, or unlink a sold vehicle |
        | CHECK_STALE | 409 | Check is stale on Ready/Export |
        | NOT_PASSED | 409 | Check is not Passed on Ready/Export |
        | UNSUPPORTED_MEDIA_TYPE | 415 | Request body is not `application/json`, or an uploaded photo is not JPEG/PNG |
        | INTERNAL_ERROR | 500 | Unexpected server error, or Google/Firebase signing keys unreachable; details are logged server-side only |
        | AI_UNAVAILABLE | 502 | Ad-check AI failed/timed out (check row already written) |
        | CATALOG_UNAVAILABLE | 502 | NHTSA vPIC unreachable or malformed |
      enum:
        - VALIDATION
        - VIN_DUP
        - SOLD_PAIR_REQUIRED
        - WRONG_DEALER_OR_SOLD
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - VERSION_CONFLICT
        - DUP_MEMBER
        - USERNAME_TAKEN
        - DISPLAY_NAME_TAKEN
        - EMAIL_TAKEN
        - PHONE_TAKEN
        - LEAD_CLOSED
        - WORK_ORDER_CLOSED
        - WORK_ORDERS_OPEN
        - VEHICLE_ALREADY_LINKED
        - SOLD_LOCKED
        - CHECK_STALE
        - NOT_PASSED
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - AI_UNAVAILABLE
        - CATALOG_UNAVAILABLE

    PageMeta:
      type: object
      required: [items, page, size, totalElements]
      description: Page envelope `{items,page,size,totalElements}`. page is zero-based; size defaults and caps at 10.
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 10
          example: 10
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 0

    Role:
      type: string
      enum: [Platform.Admin, Dealer.User]

    VehicleStatus:
      type: string
      enum: [IN_STOCK, SOLD]

    VehicleSource:
      type: string
      description: 14 example is AUCTION. Values match handbook section 3. Do not add or drop spec fields.
      enum: [TRADE_IN, AUCTION, PRIVATE_PURCHASE, OTHER]

    ConditionCode:
      type: string
      enum: [CERTIFIED, AS_IS, UNFIT, IRREPARABLE]

    VehicleBodyType:
      type: string
      description: Body-type categorisation used by DMS filters and the add/edit form. OTHER covers rare shapes.
      enum: [SEDAN, SUV, TRUCK, MOTORCYCLE, COUPE, HATCHBACK, VAN, OTHER]

    AdKind:
      type: string
      enum: [CASH, FINANCE, LEASE]

    AdMedium:
      type: string
      enum: [ONLINE, RADIO_TV_BILLBOARD]

    ListingStatus:
      type: string
      enum: [DRAFT, READY]

    CheckStatus:
      type: string
      description: Derived five-state enum for the page. STALE is only for "previously passed, now invalid".
      enum: [BLOCKED, NEEDS_AI, PASSED, STALE, AI_UNAVAILABLE]

    AiStatus:
      type: string
      enum: [SKIPPED, SUCCESS, FAILED, UNAVAILABLE]

    Recommendation:
      type: string
      enum: [BLOCKED, NEEDS_AI, PASSED, UNAVAILABLE]

    RuleSeverity:
      type: string
      enum: [BLOCK, REVIEW]

    AuditEntityType:
      type: string
      enum: [VEHICLE, CUSTOMER, CUSTOMER_VEHICLE, LISTING, DEALER, MEMBERSHIP, LEAD, WORK_ORDER, VEHICLE_PHOTO, APP_USER]

    AuditAction:
      type: string
      enum: [CREATE, UPDATE, SELL, LINK, UNLINK, NOTE, DELETE]

    AssistantCardKind:
      type: string
      enum: [VEHICLE, CUSTOMER, LISTING]

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          default: admin
          example: admin
          description: The account's email address, username, or phone number (with country code).
        password:
          type: string
          default: admin123
          example: admin123

    LoginResponse:
      type: object
      required: [accessToken, role, displayName]
      properties:
        accessToken:
          type: string
          description: "HS256 JWT. Send as `Authorization: Bearer <accessToken>`."
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string

    Me:
      type: object
      required: [username, displayName, role]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        dealerId:
          type: integer
          format: int64
          nullable: true
        dealerLegalName:
          type: string
          nullable: true
          description: Derived display field, not a second set of dealership data
        dealerContactPhone:
          type: string
          nullable: true
        dealerContactEmail:
          type: string
          nullable: true
        dealerContactAddress:
          type: string
          nullable: true
          description: The bound dealership's public contact fields (shown on the ad page); null for Admin or unbound staff
        dealerLogoDataUrl:
          type: string
          nullable: true
          description: The bound dealership's logo as an image data URL (shown in the app header); null when no logo is set
        email:
          type: string
          nullable: true
          description: The caller's own sign-in email
        phone:
          type: string
          nullable: true
          description: The caller's own phone
        signInMethod:
          type: string
          enum: [google, password]
          description: "`google` when the account has no password hash (Google or Firebase provisioned), otherwise `password`"
        givenName:
          type: string
          nullable: true
          description: From the Google ID token; null for password accounts
        familyName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true

    MePatch:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          nullable: true
          maxLength: 40
          description: Blank or null clears the phone

    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          maxLength: 4096
          description: Google Identity Services ID token
        dealerId:
          type: integer
          format: int64
          nullable: true
          description: Optional. Records a join request to this active dealership when none is pending; otherwise ignored

    GoogleSignInResponse:
      type: object
      required: [status, login]
      properties:
        status:
          type: string
          enum: [ok]
        login:
          $ref: "#/components/schemas/LoginResponse"

    FirebaseSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          maxLength: 4096
          description: Firebase Authentication ID token
        username:
          type: string
          nullable: true
          maxLength: 64
          description: Used only when a new account is created; derived from the email when omitted
        displayName:
          type: string
          nullable: true
          maxLength: 120
          description: Used only when a new account is created
        phone:
          type: string
          nullable: true
          maxLength: 40
          description: Used only when a new account is created

    PublicDealer:
      type: object
      required: [id, legalName]
      properties:
        id:
          type: integer
          format: int64
        legalName:
          type: string

    JoinRequest:
      type: object
      required: [username, displayName, createdAt]
      properties:
        username:
          type: string
          description: System username that will be bound on approve
        displayName:
          type: string
        email:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/AccountSource"

    AccountSource:
      type: string
      nullable: true
      enum: [google, firebase, password, admin, null]
      description: |
        How the account was created: Google sign-in, Firebase email sign-up, the registration
        form, or added by a platform admin. Null when unknown (for example seed data).

    Notification:
      type: object
      required: [id, kind, createdAt, payload]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: "`JOIN_REQUEST` today; the frontend narrows `payload` by kind"
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: "Kind-specific JSON. `JOIN_REQUEST`: `{username, displayName, email, source}`; `source` is the applicant's AccountSource, read at request time"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolvedAction:
          type: string
          nullable: true
          enum: [APPROVED, REJECTED, CANCELLED]

    Dealer:
      type: object
      required: [id, legalName, contactPhone, contactEmail, contactAddress, active, staffCount, version]
      properties:
        id:
          type: integer
          format: int64
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string
        logoDataUrl:
          type: string
          nullable: true
          description: Dealership logo as a downscaled image data URL; null when no logo is set
        active:
          type: boolean
        staffCount:
          type: integer
          description: Count of active memberships for this dealership (derived)
        version:
          type: integer
          format: int64

    DealerCreate:
      type: object
      required: [legalName, contactPhone, contactEmail, contactAddress]
      description: Four contact fields are required and non-blank. Values are trimmed before they are stored; an invalid email or an over-long value returns 400 VALIDATION.
      properties:
        legalName:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 40
        contactEmail:
          type: string
          format: email
          maxLength: 120
        contactAddress:
          type: string
          maxLength: 300

    DealerPatch:
      type: object
      required: [version, legalName, contactPhone, contactEmail, contactAddress, active]
      description: Full replacement of the four contact fields, `active`, and the optional logo. Every field except `logoDataUrl` is required and the strings are non-blank; a null or missing `logoDataUrl` removes the logo.
      properties:
        version:
          type: integer
          format: int64
        legalName:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 40
        contactEmail:
          type: string
          format: email
          maxLength: 120
        contactAddress:
          type: string
          maxLength: 300
        active:
          type: boolean
        logoDataUrl:
          type: string
          nullable: true
          maxLength: 200000
          pattern: "^data:image/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$"
          description: PNG, JPEG, or WebP data URL. The web client downscales the uploaded file before sending it.

    PageDealer:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dealer"

    Member:
      type: object
      required: [username, displayName, role, active, signInMethod, email, phone]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        signInMethod:
          type: string
          enum: [password, google, firebase]
          description: |
            `password` when the account has a DealerOps password (an admin can reset it), even if Google or Firebase sign-in was linked later.
            Otherwise `firebase` or `google`: that provider owns the password and an admin cannot change it.
        email:
          type: string
          nullable: true
          description: The account's own sign-in email (UI-12).
        phone:
          type: string
          nullable: true
          description: The account's own sign-in phone (UI-12).

    MemberBind:
      type: object
      required: [username]
      description: |
        A new account needs `displayName`, `password`, and an `email` and/or `phone` (at least one); it can sign in with its username, email, or phone. For an existing account (such as a pending self sign-up), these fields may be omitted and its credentials are never changed.
      properties:
        username:
          type: string
          maxLength: 64
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          minLength: 8
          description: Temporary password for a new account; stored only as a BCrypt hash.
        email:
          type: string
          format: email
          maxLength: 254
          description: Login email for a new account; email and/or phone is required (at least one).
        phone:
          type: string
          maxLength: 40
          description: International login phone number for a new account (7–15 digits with country code; spaces, dashes, dots, and brackets ignored; stored as `+digits`); email and/or phone is required (at least one).

    PageMember:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Member"

