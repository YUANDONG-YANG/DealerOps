openapi: 3.0.3
info:
  title: DealerOps Gateway API
  version: "6.0"
  description: |
    Current HTTP JSON is defined by `design/14-Backend-API-Contract.md`. This file is for coding AIs generating Controllers / clients.

    **Entry:** browsers and external clients call only Gateway `http://localhost:8080`, prefix `/api/v1/**`.
    core=8081 and ai-service=8082 are not public. Bypassing the Gateway must fail.

    **Internal:** `/internal/v1/**` tagged `Internal` with `x-internal: true` is only core calling ai-service through the Gateway.
    Browsers cannot reach these paths: the Gateway returns **404** (not 401) when the internal header is missing, so the path is not acknowledged.
    Internal AI **success/failure JSON** is pinned by `design/AI-PROTOCOL-AND-RULES.md` §B.2–B.3 (`{success,notes[]}` and `{success,summary}`). That protocol wins over older OpenAPI or 14 §11 wording that only said “notes” / “short text”.

    **Tenant / auth (behavior aligned with 15; fields still come only from 14):**
    - `POST /api/v1/auth/login` is the only anonymous `/api/v1` operation. It returns an HS256 `accessToken` (claims `sub`=username, `name`, `roles`); every other operation needs `Authorization: Bearer <accessToken>`.
    - Roles are only `Platform.Admin` and `Dealer.User`. Ignore client `dealerId` in body / query / header.
    - Staff tenant comes only from the JWT `sub` (the username) → exactly one `membership.active=1` row.
    - Cross-dealership or unknown id in this dealership → **404** `NOT_FOUND` (anti-probing; not 403).
    - Admin hitting business URLs, staff hitting Admin URLs, or staff without valid membership calling business APIs → **403** `FORBIDDEN`.
    - `GET /me` is still **200** when authenticated with no dealership (`dealerId=null`).
    - Writes that carry `version` must match the current row, otherwise **409** `VERSION_CONFLICT`.
    - Unlink `DELETE .../vehicles/{vehicleId}` → **204**. Sold vehicles cannot be unlinked → **409** `SOLD_LOCKED`.
    - Ad check Blocked / Needs AI / Passed → **200** (Blocked is not an HTTP error). Rules passed but AI failed → **502** `AI_UNAVAILABLE` (check row already written).

    If public `/api/v1` details conflict, 14 wins. Do not invent business fields that 14 does not define.
    If **internal** AI request/response details conflict, PROTOCOL §B.2–B.3 wins.
  x-conflict-authority: design/14-Backend-API-Contract.md
  x-internal-ai-authority: design/AI-PROTOCOL-AND-RULES.md

servers:
  - url: http://localhost:8080
    description: Gateway only. The only public API origin.

tags:
  - name: Auth
    description: Anonymous login with an admin-issued username and password
  - name: Me
    description: Current authenticated identity
  - name: AdminDealers
    description: Platform.Admin dealership CRUD
  - name: AdminMemberships
    description: Platform.Admin staff membership binding
  - name: Vehicles
    description: Dealer.User vehicle DMS
  - name: Customers
    description: Dealer.User customer CRM
  - name: Link
    description: Link / unlink vehicle
  - name: Listings
    description: One listing draft per vehicle
  - name: Checks
    description: Compliance check, Ready, Export
  - name: Audit
    description: This-dealership audit query
  - name: Assistant
    description: Staff assistant (does not write business tables)
  - name: Internal
    description: |
      Gateway → ai-service. Not reachable from the browser (404).
      For the core adapter only. Do not generate these client methods as user APIs for the SPA.
      Success JSON is application/json `{success,notes[]}` (ad-check) or `{success,summary}` (assistant), not text/plain.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login
      description: |
        Anonymous. Loads the active `app_user` by `username` and verifies the BCrypt password hash.
        Unknown username, inactive account, or wrong password → **401** `UNAUTHORIZED` with the same message.
        Blank `username` or `password` → **400** `VALIDATION`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          description: Invalid username or password. code=`UNAUTHORIZED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHORIZED
                message: Invalid username or password

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user
      description: Any authenticated user. Admin `dealerId` and `dealerLegalName` are null. Staff without valid membership still get 200 with `dealerId=null`.
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/dealers:
    get:
      tags: [AdminDealers]
      operationId: listDealers
      summary: Dealership list
      parameters:
        - $ref: "#/components/parameters/QLegalName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged dealerships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDealer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AdminDealers]
      operationId: createDealer
      summary: Create dealership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/dealers/{id}:
    parameters:
      - $ref: "#/components/parameters/DealerId"
    get:
      tags: [AdminDealers]
      operationId: getDealer
      summary: One dealership (Admin edit form)
      responses:
        "200":
          description: Dealership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [AdminDealers]
      operationId: patchDealer
      summary: Patch four contact fields and active
      description: Every field, including `version` and `active`, is required. Ignore body.`id`. There is no `DELETE /admin/dealers/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerPatch"
      responses:
        "200":
          description: Updated dealership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/admin/dealers/{id}/members:
    parameters:
      - $ref: "#/components/parameters/DealerId"
    get:
      tags: [AdminMemberships]
      operationId: listMembers
      summary: Dealership members
      description: Unknown dealership → 404. `q` matches `displayName` or `username`. Do not invent email.
      parameters:
        - $ref: "#/components/parameters/QDisplayOrUsername"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AdminMemberships]
      operationId: bindMember
      summary: Bind staff
      description: |
        Already an **active** member of this dealership, still active at another dealership, or the username belongs to a Platform.Admin account → **409** `DUP_MEMBER`.
        Re-binding a previously unbound person reactivates them (not 409) and resets their password to the one supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberBind"
      responses:
        "201":
          description: Member item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DUP_MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: DUP_MEMBER
                message: Already an active member of this dealership.

  /api/v1/admin/dealers/{id}/members/{username}:
    delete:
      tags: [AdminMemberships]
      operationId: unbindMember
      summary: Unbind staff
      description: Unbind without deleting the `app_user` account. Unknown binding → 404. Success **204** with no body.
      parameters:
        - $ref: "#/components/parameters/DealerId"
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: Unbound, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: This-dealership vehicles
      description: Default `createdAt` descending. Admin → 403. No valid membership → 403.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: VIN / make / model
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VehicleStatus"
        - name: condition
          in: query
          schema:
            $ref: "#/components/schemas/ConditionCode"
          description: Same as `conditionCode`
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Intake vehicle
      description: |
        Required: make/model/modelYear/vin/source/purchaseCost/addedOn/conditionCode.
        Ignore `dealerId`, `status`, `soldOn`, `soldPrice`. Server sets `status=IN_STOCK`.
        Duplicate VIN in this dealership → **400** `VIN_DUP`. Audit `VEHICLE`/`CREATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreate"
      responses:
        "201":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: VALIDATION or VIN_DUP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation:
                  value:
                    code: VALIDATION
                    message: Request is invalid.
                vinDup:
                  value:
                    code: VIN_DUP
                    message: VIN already exists in this dealership.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: Vehicle detail
      description: Cross-dealership or unknown vehicle → **404**.
      responses:
        "200":
          description: Same as list item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Vehicles]
      operationId: patchVehicle
      summary: Patch purchase/identity whitelist
      description: |
        PATCH must not change `status` / `soldOn` / `soldPrice` (use `/sell`). Ignore `dealerId`.
        Changing purchase fields on a sold vehicle → **409** `SOLD_LOCKED`. Changing VIN on an unsold vehicle still has dealership uniqueness → **400** `VIN_DUP`.
        Changing `conditionCode` increments the matching listing `contentVersion++` when a listing exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiclePatch"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: VALIDATION or VIN_DUP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VERSION_CONFLICT or SOLD_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                soldLocked:
                  value:
                    code: SOLD_LOCKED
                    message: Sold vehicles cannot change purchase identity fields.
                version:
                  value:
                    code: VERSION_CONFLICT
                    message: version does not match.

  /api/v1/vehicles/{id}/sell:
    post:
      tags: [Vehicles]
      operationId: sellVehicle
      summary: Sell as a required pair
      description: |
        `soldOn` and `soldPrice` must both be present. Server sets `status=SOLD`.
        Missing either → **400** `SOLD_PAIR_REQUIRED`. `soldOn` in the future or before `addedOn`,
        or `soldPrice` ≤ 0 → **400** `VALIDATION`. Selling again → **409** `SOLD_LOCKED`.
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleSell"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: SOLD_PAIR_REQUIRED or VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SOLD_PAIR_REQUIRED
                message: soldOn and soldPrice are both required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOLD_LOCKED or VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: This-dealership customers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: name / email / phone
        - name: linked
          in: query
          schema:
            type: boolean
          description: Whether at least one vehicle is linked
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged customers (list uses linkedVehicle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCustomerListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create customer
      description: "Ignore `dealerId`. Response is the detail (`linkedVehicles: []`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWrite"
      responses:
        "201":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Customer detail
      description: Cross-dealership **404**. `linkedVehicles` is the full array.
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: patchCustomer
      summary: Patch the four customer fields
      description: Ignore `dealerId`. Audit `fieldSummary` must not contain full phone/email/home address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPatch"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/customers/{id}/vehicles/{vehicleId}:
    put:
      tags: [Link]
      operationId: linkCustomerVehicle
      summary: Link vehicle
      description: |
        No body (or ignore body). Customer and vehicle must be in the same dealership, vehicle `IN_STOCK`, vehicle not yet linked to any customer.
        Sold / not IN_STOCK on a **this-store** vehicle → **400** `WRONG_DEALER_OR_SOLD` (PROTOCOL A.1). Cross-dealership id → **404** (never that code).
        Vehicle already linked (including to this customer) → **409** `VEHICLE_ALREADY_LINKED`.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/VehicleIdPath"
      responses:
        "200":
          description: Link row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerVehicleLink"
        "400":
          description: WRONG_DEALER_OR_SOLD (PROTOCOL A.1 — this-store sold / not IN_STOCK on PUT link only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: WRONG_DEALER_OR_SOLD
                message: Vehicle is sold or not in this dealership.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: VEHICLE_ALREADY_LINKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VEHICLE_ALREADY_LINKED
                message: Vehicle is already linked to a customer.
    delete:
      tags: [Link]
      operationId: unlinkCustomerVehicle
      summary: Unlink
      description: |
        Remove the link between this customer and this vehicle. Do not change vehicle `status`. Success **204** with no body.
        Vehicle `status=SOLD` → **409** `SOLD_LOCKED` (the sale record must not be erased).
        No such link or cross-dealership → **404** (not 403).
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/VehicleIdPath"
      responses:
        "204":
          description: Unbound, no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOLD_LOCKED (sold vehicles cannot be unlinked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SOLD_LOCKED
                message: Sold vehicles cannot be unlinked.

  /api/v1/vehicles/{id}/listing:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      tags: [Listings]
      operationId: getVehicleListing
      summary: Get listing draft
      description: |
        No row: **do not insert or persist**. Return a virtual empty draft (`id=null`, `title`/`body`=`""`).
        Cross-dealership vehicle **404**. `lastCheck` is the latest full check object or null.
      responses:
        "200":
          description: listing (virtual or persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      operationId: patchVehicleListing
      summary: Save listing draft
      description: |
        INSERT if no row exists. Increment `contentVersion` and set `status` back to `DRAFT`.
        Missing or blank `title`/`body` are stored as `''` (NOT NULL).
        First save may omit `version` or send `0`; later saves must send the current `version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingPatch"
      responses:
        "200":
          description: Persisted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/listings/{id}/checks:
    post:
      tags: [Checks]
      operationId: runListingCheck
      summary: Run compliance check
      description: |
        `version` is the listing optimistic lock. Run the fixed checklist first; if there is no hard block, call Gateway `POST /internal/v1/ad-check` (≤15s).
        **Blocked / Needs AI / Passed → HTTP 200** (Blocked is not a 4xx).
        Rules passed but AI timed out or failed → **502** `AI_UNAVAILABLE`; the check row is already written as `UNAVAILABLE`.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Full check object (includes checkStatus). Blocked is still 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "502":
          description: AI_UNAVAILABLE (rules passed, model timed out/failed; check row already written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AI_UNAVAILABLE
                message: Ad check model timed out or failed.

  /api/v1/listings/{id}/ready:
    post:
      tags: [Checks]
      operationId: markListingReady
      summary: Mark Ready
      description: Only when the current check is Passed and not Stale. Success sets listing `status=READY`.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Same as GET listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CHECK_STALE / NOT_PASSED / VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                stale:
                  value:
                    code: CHECK_STALE
                    message: Last passed check does not match listing contentVersion.
                notPassed:
                  value:
                    code: NOT_PASSED
                    message: Listing check is not PASSED.

  /api/v1/listings/{id}/exports:
    post:
      tags: [Checks]
      operationId: exportListing
      summary: Export plain text
      description: |
        Body is the same as ready. Same 409/404.
        Success **200** `text/plain; charset=UTF-8`.
        Content = dealership public four fields + vehicle public fields (year/make/model/vin/condition/source, **no cost**) + title/body + check time. Do not include customers.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionBody"
      responses:
        "200":
          description: Plain-text export
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Type:
              schema:
                type: string
                default: text/plain; charset=UTF-8
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CHECK_STALE / NOT_PASSED / VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Audit
      description: |
        `entityType` and `entityId` are required. Staff see this dealership only; entity not in this dealership → 404.
        Admin querying business entities (VEHICLE/CUSTOMER/CUSTOMER_VEHICLE/LISTING) → **403** `FORBIDDEN`.
        Staff may query `VEHICLE`|`CUSTOMER`|`CUSTOMER_VEHICLE`. This query does not open `DEALER`/`MEMBERSHIP` to staff.
        `fieldSummary` has no full customer phone/email/home address.
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditEntityType"
        - name: entityId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEvent"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/assistant/ask:
    post:
      tags: [Assistant]
      operationId: askAssistant
      summary: Staff assistant
      description: |
        Dealer.User only. Admin → 403. **Does not write** vehicle/customer/listing/check tables.
        Empty `text` → **400** `VALIDATION`.
        Model down: `summary=null`, `summaryAvailable=false`, `cards` remain the retrieval list (max 5), HTTP **200**.
        Cards have no phone, email, or home address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantAsk"
      responses:
        "200":
          description: Short summary plus at most 5 this-dealership resource cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswer"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /internal/v1/ad-check:
    post:
      tags: [Internal]
      x-internal: true
      operationId: internalAdCheck
      summary: Internal ad AI check
      description: |
        **Not reachable from the browser (Gateway 404).** Only core calls ai-service through the Gateway.
        Do not forward the user JWT to ai-service. `vehiclePublic` has **no** purchase/repair/sold price.
        Request body remains 14 §11 (`listing` + `vehiclePublic` + `dealerPublic`).
        Success body is PROTOCOL §B.2 JSON `{success:true, notes[]}` (not public `aiNotes` only, not business columns).
        core persists `notes` onto the check row as `aiNotes`. Do not invent `recommendation` / `checkStatus` / `ruleFindings`.
        Failure uses the same JSON as assistant: `{success:false, code, message}` with 504/503/502. core maps any failure to public 502 `AI_UNAVAILABLE`.
      security: []
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAdCheckRequest"
      responses:
        "200":
          description: HTTP 200 and `success=true`. `notes` may be `[]`; each item at least `{message}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAdCheckOk"
              example:
                success: true
                notes:
                  - message: No additional misleading claims found.
        "502":
          $ref: "#/components/responses/InternalAiProviderFailed"
        "503":
          $ref: "#/components/responses/InternalAiKeyMissing"
        "504":
          $ref: "#/components/responses/InternalAiTimeout"
        "404":
          description: Browser or missing internal header → Gateway/ai-service 404 (do not acknowledge the path)

  /internal/v1/assistant:
    post:
      tags: [Internal]
      x-internal: true
      operationId: internalAssistant
      summary: Internal assistant JSON
      description: |
        **Not reachable from the browser (Gateway 404).** Only core calls ai-service through the Gateway.
        Request body remains 14 §11 (`question` + already-filtered `resources`).
        Success body is PROTOCOL §B.3 JSON `{success:true, summary}` (`application/json`, not `text/plain`).
        `summary` is a short non-empty explanation. core re-checks card ids (keep only ids that appeared in this `resources`).
        Failure uses the same JSON shape and HTTP/code table as ad-check. core must not send 502 to the browser; public remains 200 with `summary=null`.
      security: []
      parameters:
        - $ref: "#/components/parameters/InternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAssistantRequest"
      responses:
        "200":
          description: HTTP 200 and `success=true` with a non-empty `summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAssistantOk"
              example:
                success: true
                summary: Two in-stock Toyotas match. Open a card for DMS.
        "502":
          $ref: "#/components/responses/InternalAiProviderFailed"
        "503":
          $ref: "#/components/responses/InternalAiKeyMissing"
        "504":
          $ref: "#/components/responses/InternalAiTimeout"
        "404":
          description: Browser or missing internal header → 404

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by `POST /api/v1/auth/login`. Missing/bad JWT → 401 `UNAUTHORIZED`.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
      description: Default 10, server cap 10
    QLegalName:
      name: q
      in: query
      schema:
        type: string
      description: Matches legalName
    QDisplayOrUsername:
      name: q
      in: query
      schema:
        type: string
      description: Matches displayName or username
    DealerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehicleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    InternalToken:
      name: X-Dealer-Internal
      in: header
      required: true
      schema:
        type: string
      description: |
        Internal call header. Browsers must not send it (CORS does not expose it). Missing header → 404.
        Not a user JWT. Value comes from env / Key Vault.

  responses:
    Unauthorized:
      description: Missing/bad JWT. code=`UNAUTHORIZED`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Missing or invalid JWT.
    Forbidden:
      description: |
        Role is not allowed on this URL (Admin↔staff hit the wrong prefix), or staff without valid `membership.active=1` called a business API.
        **Not** a cross-dealership case. code=`FORBIDDEN`. Body must not include vin/cost or other business fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: Role or membership does not allow this URL.
    NotFound:
      description: Unknown id in this dealership, or a **cross-dealership id** (anti-probing, not 403). code=`NOT_FOUND`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Resource not found.
    Validation:
      description: Missing field, illegal enum, or bad format. code=`VALIDATION`; may include `fieldErrors`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION
            message: Request is invalid.
            fieldErrors:
              vin: must not be blank
    VersionConflict:
      description: Request `version` does not match the current row. code=`VERSION_CONFLICT`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VERSION_CONFLICT
            message: version does not match.
    InternalAiTimeout:
      description: Internal only (PROTOCOL §B.2). Connect+response timeout. Do not send `AI_TIMEOUT` to the browser.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_TIMEOUT
            message: Model call exceeded 15s.
    InternalAiKeyMissing:
      description: Internal only. `AIMANAGER_API_KEY` missing or blank. Immediate 503; do not wait 15s.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_KEY_MISSING
            message: AIMANAGER_API_KEY is missing or invalid.
    InternalAiProviderFailed:
      description: Internal only. Invalid key, `isSuccess()==false`, parse failure, or vendor error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAiFailure"
          example:
            success: false
            code: AI_PROVIDER_FAILED
            message: Model did not return a usable result.

  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        Standard error body. No SQL, stacks, or raw model text.
        `400 VALIDATION` may add `fieldErrors`.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: Optional for VALIDATION only

    ErrorCode:
      type: string
      description: |
        | code | HTTP | Meaning |
        |---|---|---|
        | VALIDATION | 400 | Missing field, illegal enum, or bad format |
        | VIN_DUP | 400 | Duplicate VIN in this dealership |
        | SOLD_PAIR_REQUIRED | 400 | Sell missing date or price |
        | WRONG_DEALER_OR_SOLD | 400 | PROTOCOL A.1: this-store PUT link when sold / not IN_STOCK (cross-store is 404) |
        | UNAUTHORIZED | 401 | Not authenticated |
        | FORBIDDEN | 403 | Role not allowed on this URL, or staff has no valid membership |
        | NOT_FOUND | 404 | Missing resource or cross-dealership; also an unknown API path |
        | METHOD_NOT_ALLOWED | 405 | HTTP method not supported on this path |
        | VERSION_CONFLICT | 409 | version mismatch |
        | DUP_MEMBER | 409 | This dealership already has this active member |
        | VEHICLE_ALREADY_LINKED | 409 | Vehicle already linked to a customer |
        | SOLD_LOCKED | 409 | Sold purchase edit, sell again, or unlink a sold vehicle |
        | CHECK_STALE | 409 | Check is stale on Ready/Export |
        | NOT_PASSED | 409 | Check is not Passed on Ready/Export |
        | UNSUPPORTED_MEDIA_TYPE | 415 | Request body is not `application/json` |
        | INTERNAL_ERROR | 500 | Unexpected server error; details are logged server-side only |
        | AI_UNAVAILABLE | 502 | Ad-check AI failed/timed out (check row already written) |
      enum:
        - VALIDATION
        - VIN_DUP
        - SOLD_PAIR_REQUIRED
        - WRONG_DEALER_OR_SOLD
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - VERSION_CONFLICT
        - DUP_MEMBER
        - VEHICLE_ALREADY_LINKED
        - SOLD_LOCKED
        - CHECK_STALE
        - NOT_PASSED
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - AI_UNAVAILABLE

    PageMeta:
      type: object
      required: [items, page, size, total]
      description: Page envelope `{items,page,size,total}`. page is zero-based; size defaults and caps at 10.
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 10
          example: 10
        total:
          type: integer
          format: int64
          minimum: 0
          example: 0

    Role:
      type: string
      enum: [Platform.Admin, Dealer.User]

    VehicleStatus:
      type: string
      enum: [IN_STOCK, SOLD]

    VehicleSource:
      type: string
      description: 14 example is AUCTION. Values match handbook section 3. Do not add or drop spec fields.
      enum: [TRADE_IN, AUCTION, PRIVATE_PURCHASE, OTHER]

    ConditionCode:
      type: string
      enum: [CERTIFIED, AS_IS, UNFIT, IRREPARABLE]

    AdKind:
      type: string
      enum: [CASH, FINANCE, LEASE]

    AdMedium:
      type: string
      enum: [ONLINE, RADIO_TV_BILLBOARD]

    ListingStatus:
      type: string
      enum: [DRAFT, READY]

    CheckStatus:
      type: string
      description: Derived five-state enum for the page. STALE is only for "previously passed, now invalid".
      enum: [BLOCKED, NEEDS_AI, PASSED, STALE, AI_UNAVAILABLE]

    AiStatus:
      type: string
      enum: [SKIPPED, SUCCESS, FAILED, UNAVAILABLE]

    Recommendation:
      type: string
      enum: [BLOCKED, NEEDS_AI, PASSED, UNAVAILABLE]

    RuleSeverity:
      type: string
      enum: [BLOCK, REVIEW]

    AuditEntityType:
      type: string
      enum: [VEHICLE, CUSTOMER, CUSTOMER_VEHICLE, LISTING, DEALER, MEMBERSHIP]

    AuditAction:
      type: string
      enum: [CREATE, UPDATE, SELL, LINK, UNLINK]

    AssistantCardKind:
      type: string
      enum: [VEHICLE, CUSTOMER, LISTING]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Admin-issued login; leading/trailing spaces are trimmed
        password:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, role, displayName]
      properties:
        accessToken:
          type: string
          description: "HS256 JWT. Send as `Authorization: Bearer <accessToken>`."
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string

    Me:
      type: object
      required: [username, displayName, role]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        dealerId:
          type: integer
          format: int64
          nullable: true
        dealerLegalName:
          type: string
          nullable: true
          description: Derived display field, not a second set of dealership data
        dealerContactPhone:
          type: string
          nullable: true
        dealerContactEmail:
          type: string
          nullable: true
        dealerContactAddress:
          type: string
          nullable: true
          description: The bound dealership's public contact fields (shown on the ad page); null for Admin or unbound staff

    Dealer:
      type: object
      required: [id, legalName, contactPhone, contactEmail, contactAddress, active, staffCount, version]
      properties:
        id:
          type: integer
          format: int64
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string
        active:
          type: boolean
        staffCount:
          type: integer
          description: Count of active memberships for this dealership (derived)
        version:
          type: integer
          format: int64

    DealerCreate:
      type: object
      required: [legalName, contactPhone, contactEmail, contactAddress]
      description: Four contact fields are required and non-empty
      properties:
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string

    DealerPatch:
      type: object
      required: [version, legalName, contactPhone, contactEmail, contactAddress, active]
      description: Full replacement of the four contact fields and `active`; every field is required and the strings are non-blank.
      properties:
        version:
          type: integer
          format: int64
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string
        active:
          type: boolean

    PageDealer:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dealer"

    Member:
      type: object
      required: [username, displayName, role, active]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean

    MemberBind:
      type: object
      required: [username, displayName, password]
      properties:
        username:
          type: string
          maxLength: 64
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          minLength: 8
          description: Temporary password the admin issues; stored only as a BCrypt hash.

    PageMember:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Member"

    Vehicle:
      type: object
      required:
        - id
        - vin
        - make
        - model
        - modelYear
        - source
        - purchaseCost
        - addedOn
        - conditionCode
        - status
        - version
      properties:
        id:
          type: integer
          format: int64
        vin:
          type: string
        make:
          type: string
        model:
          type: string
        modelYear:
          type: integer
        source:
          $ref: "#/components/schemas/VehicleSource"
        purchaseCost:
          type: number
        addedOn:
          type: string
          format: date
          description: YYYY-MM-DD
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        repairCost:
          type: number
          nullable: true
        carfaxUrl:
          type: string
          nullable: true
        soldOn:
          type: string
          format: date
          nullable: true
        soldPrice:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/VehicleStatus"
        linkedCustomer:
          type: object
          nullable: true
          description: Linked customer (DMS-08); null when unlinked. Never carries contact fields.
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        version:
          type: integer
          format: int64

    VehicleCreate:
      type: object
      required: [make, model, modelYear, vin, source, purchaseCost, addedOn, conditionCode]
      properties:
        make:
          type: string
          maxLength: 50
          description: Trimmed by the server
        model:
          type: string
          maxLength: 50
          description: Trimmed by the server
        modelYear:
          type: integer
          minimum: 1900
          description: 1900 to next calendar year (upper bound checked by the service)
        vin:
          type: string
          pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"
          description: 17 characters without I, O, or Q; stored upper-cased
        source:
          $ref: "#/components/schemas/VehicleSource"
        purchaseCost:
          type: number
          minimum: 0
          description: At most 10 integer digits and 2 decimals
        addedOn:
          type: string
          format: date
          description: YYYY-MM-DD, not in the future
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        repairCost:
          type: number
          minimum: 0
          nullable: true
        carfaxUrl:
          type: string
          maxLength: 500
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://\\S+$"
          description: http(s) URL
          nullable: true

    VehiclePatch:
      type: object
      required: [version, make, model, modelYear, vin, source, purchaseCost, addedOn, conditionCode]
      description: Full replacement of this whitelist with the same rules as create. Do not change status/soldOn/soldPrice.
      properties:
        version:
          type: integer
          format: int64
        make:
          type: string
          maxLength: 50
          description: Trimmed by the server
        model:
          type: string
          maxLength: 50
          description: Trimmed by the server
        modelYear:
          type: integer
          minimum: 1900
          description: 1900 to next calendar year (upper bound checked by the service)
        vin:
          type: string
          pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"
          description: 17 characters without I, O, or Q; stored upper-cased
        source:
          $ref: "#/components/schemas/VehicleSource"
        purchaseCost:
          type: number
          minimum: 0
          description: At most 10 integer digits and 2 decimals
        addedOn:
          type: string
          format: date
          description: YYYY-MM-DD, not in the future
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        repairCost:
          type: number
          minimum: 0
          nullable: true
        carfaxUrl:
          type: string
          maxLength: 500
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://\\S+$"
          description: http(s) URL
          nullable: true

    VehicleSell:
      type: object
      required: [version]
      description: "`soldOn` and `soldPrice` are a required pair: either missing → 400 `SOLD_PAIR_REQUIRED`."
      properties:
        soldOn:
          type: string
          format: date
          description: Not in the future and not before `addedOn`
        soldPrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        version:
          type: integer
          format: int64

    PageVehicle:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Vehicle"

    LinkedVehicleSummary:
      type: object
      description: One CRM table column. If several vehicles, use the latest linkedAt. Null when unlinked.
      required: [id, modelYear, make, model]
      properties:
        id:
          type: integer
          format: int64
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string

    LinkedVehicleDetail:
      type: object
      required: [id, vin, modelYear, make, model, status]
      properties:
        id:
          type: integer
          format: int64
        vin:
          type: string
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"

    CustomerListItem:
      type: object
      required: [id, name, email, phone, homeAddress, version]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        homeAddress:
          type: string
        linkedVehicle:
          allOf:
            - $ref: "#/components/schemas/LinkedVehicleSummary"
          nullable: true
        linkedVehicleCount:
          type: integer
          description: Number of vehicles linked to this customer (CRM list "vehicles purchased" count)
        version:
          type: integer
          format: int64

    Customer:
      type: object
      required: [id, name, email, phone, homeAddress, linkedVehicles, version]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        homeAddress:
          type: string
        linkedVehicles:
          type: array
          items:
            $ref: "#/components/schemas/LinkedVehicleDetail"
        version:
          type: integer
          format: int64

    CustomerWrite:
      type: object
      required: [name, email, phone, homeAddress]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
          pattern: "^(?=(?:\\D*\\d){7,20}\\D*$)[0-9+\\-() ]+$"
          description: 7-20 digits; only digits, '+', '-', '(', ')' and spaces
        homeAddress:
          type: string
          maxLength: 300

    CustomerPatch:
      type: object
      required: [version, name, email, phone, homeAddress]
      description: Full replacement with the same rules as create.
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
          pattern: "^(?=(?:\\D*\\d){7,20}\\D*$)[0-9+\\-() ]+$"
          description: 7-20 digits; only digits, '+', '-', '(', ')' and spaces
        homeAddress:
          type: string
          maxLength: 300

    PageCustomerListItem:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CustomerListItem"

    CustomerVehicleLink:
      type: object
      required: [id, customerId, vehicleId, linkedAt]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        vehicleId:
          type: integer
          format: int64
        linkedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC

    RuleFinding:
      type: object
      required: [ruleId, severity, passed, message]
      properties:
        ruleId:
          type: string
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        passed:
          type: boolean
        message:
          type: string

    AiNote:
      type: object
      required: [message]
      description: Structured model notes; each element at least `{message}`
      properties:
        message:
          type: string

    Check:
      type: object
      required:
        - id
        - listingId
        - contentVersion
        - ruleFindings
        - aiStatus
        - recommendation
        - checkStatus
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        contentVersion:
          type: integer
          format: int64
        ruleFindings:
          type: array
          items:
            $ref: "#/components/schemas/RuleFinding"
        aiStatus:
          $ref: "#/components/schemas/AiStatus"
        aiNotes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AiNote"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
        createdAt:
          type: string
          format: date-time

    Listing:
      type: object
      required:
        - vehicleId
        - title
        - body
        - adKind
        - medium
        - status
        - contentVersion
        - checkStatus
        - version
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Null for a virtual empty draft
        vehicleId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"
        status:
          $ref: "#/components/schemas/ListingStatus"
        contentVersion:
          type: integer
          format: int64
        lastCheckId:
          type: integer
          format: int64
          nullable: true
        lastCheck:
          allOf:
            - $ref: "#/components/schemas/Check"
          nullable: true
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
        version:
          type: integer
          format: int64

    ListingPatch:
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: May omit or send 0 on first save
        title:
          type: string
          maxLength: 200
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"

    ListingVersionBody:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: listing optimistic lock

    AuditEvent:
      type: object
      required: [id, entityType, entityId, action, actorUsername, createdAt]
      properties:
        id:
          type: integer
          format: int64
        entityType:
          $ref: "#/components/schemas/AuditEntityType"
        entityId:
          type: integer
          format: int64
        action:
          $ref: "#/components/schemas/AuditAction"
        fieldSummary:
          type: object
          additionalProperties: true
          description: No full customer phone/email/home address. Link/unlink only {customerId,vehicleId}
        actorUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    PageAuditEvent:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"

    AssistantAsk:
      type: object
      required: [text]
      properties:
        text:
          type: string

    AssistantCard:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          $ref: "#/components/schemas/AssistantCardKind"
        id:
          type: integer
          format: int64
        label:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"
          description: VEHICLE cards only (14 example)
        vehicleId:
          type: integer
          format: int64
          description: LISTING cards only (14 example)
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
          description: LISTING cards only (14 example)

    AssistantAnswer:
      type: object
      required: [summaryAvailable, cards]
      properties:
        summary:
          type: string
          nullable: true
        summaryAvailable:
          type: boolean
        cards:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AssistantCard"

    VehiclePublic:
      type: object
      description: For internal checks. No purchase/repair/sold price.
      required: [modelYear, make, model, vin, conditionCode, source]
      properties:
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string
        vin:
          type: string
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        source:
          $ref: "#/components/schemas/VehicleSource"

    DealerPublic:
      type: object
      required: [legalName, contactPhone, contactEmail, contactAddress]
      properties:
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string

    InternalListingSlice:
      type: object
      required: [title, body, adKind, medium]
      properties:
        title:
          type: string
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"

    InternalAdCheckRequest:
      type: object
      required: [listing, vehiclePublic, dealerPublic]
      properties:
        listing:
          $ref: "#/components/schemas/InternalListingSlice"
        vehiclePublic:
          $ref: "#/components/schemas/VehiclePublic"
        dealerPublic:
          $ref: "#/components/schemas/DealerPublic"

    InternalAdCheckOk:
      type: object
      required: [success, notes]
      description: |
        PROTOCOL §B.2 success. `success` must be `true`. `notes` may be `[]`; each element at least `{message}`.
        core writes `notes` as-is onto public `Check.aiNotes`. Ban `recommendation` / `checkStatus` / `ruleFindings`.
      properties:
        success:
          type: boolean
          enum: [true]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/AiNote"

    InternalAssistantOk:
      type: object
      required: [success, summary]
      description: |
        PROTOCOL §B.3 success. `application/json`, not `text/plain`. `summary` is short and non-empty.
      properties:
        success:
          type: boolean
          enum: [true]
        summary:
          type: string
          minLength: 1

    InternalAiFailure:
      type: object
      required: [success, code, message]
      description: |
        PROTOCOL §B.2–B.3 unified failure for both internal AI paths. `success` must be `false`.
        HTTP and `code` table: 504 `AI_TIMEOUT`, 503 `AI_KEY_MISSING`, 502 `AI_PROVIDER_FAILED`.
        These codes are **not** public `/api/v1` ErrorCode values.
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [AI_TIMEOUT, AI_KEY_MISSING, AI_PROVIDER_FAILED]
        message:
          type: string

    InternalAssistantResource:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          $ref: "#/components/schemas/AssistantCardKind"
        id:
          type: integer
          format: int64
        label:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"

    InternalAssistantRequest:
      type: object
      required: [question, resources]
      properties:
        question:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/InternalAssistantResource"
