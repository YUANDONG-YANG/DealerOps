    VehicleCreate:
      type: object
      required: [make, model, modelYear, vin, source, purchaseCost, addedOn, conditionCode]
      properties:
        make:
          type: string
          maxLength: 50
          description: Trimmed by the server
        model:
          type: string
          maxLength: 50
          description: Trimmed by the server
        modelYear:
          type: integer
          minimum: 1900
          description: 1900 to next calendar year (upper bound checked by the service)
        vin:
          type: string
          pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"
          description: 17 characters without I, O, or Q; stored upper-cased
        source:
          $ref: "#/components/schemas/VehicleSource"
        purchaseCost:
          type: number
          minimum: 0
          description: At most 10 integer digits and 2 decimals
        addedOn:
          type: string
          format: date
          description: YYYY-MM-DD, not in the future
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        bodyType:
          $ref: "#/components/schemas/VehicleBodyType"
        repairCost:
          type: number
          minimum: 0
          nullable: true
        carfaxUrl:
          type: string
          maxLength: 500
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://\\S+$"
          description: http(s) URL
          nullable: true
        mileageKm:
          type: integer
          minimum: 0
          maximum: 2000000
          nullable: true
        exteriorColor:
          type: string
          maxLength: 40
          nullable: true
        fuelType:
          allOf: [{ $ref: "#/components/schemas/FuelType" }]
          nullable: true
        stockNumber:
          type: string
          maxLength: 20
          nullable: true
          description: Unique among the dealership's active vehicles (else 400 VALIDATION on stockNumber)
        listPrice:
          type: number
          minimum: 0
          nullable: true
          description: At most 2 decimals

    VehiclePatch:
      type: object
      required: [version, make, model, modelYear, vin, source, purchaseCost, addedOn, conditionCode]
      description: Full replacement of this whitelist with the same rules as create. Do not change status/soldOn/soldPrice.
      properties:
        version:
          type: integer
          format: int64
        make:
          type: string
          maxLength: 50
          description: Trimmed by the server
        model:
          type: string
          maxLength: 50
          description: Trimmed by the server
        modelYear:
          type: integer
          minimum: 1900
          description: 1900 to next calendar year (upper bound checked by the service)
        vin:
          type: string
          pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"
          description: 17 characters without I, O, or Q; stored upper-cased
        source:
          $ref: "#/components/schemas/VehicleSource"
        purchaseCost:
          type: number
          minimum: 0
          description: At most 10 integer digits and 2 decimals
        addedOn:
          type: string
          format: date
          description: YYYY-MM-DD, not in the future
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        bodyType:
          $ref: "#/components/schemas/VehicleBodyType"
        repairCost:
          type: number
          minimum: 0
          nullable: true
        carfaxUrl:
          type: string
          maxLength: 500
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://\\S+$"
          description: http(s) URL
          nullable: true
        mileageKm:
          type: integer
          minimum: 0
          maximum: 2000000
          nullable: true
        exteriorColor:
          type: string
          maxLength: 40
          nullable: true
        fuelType:
          allOf: [{ $ref: "#/components/schemas/FuelType" }]
          nullable: true
        stockNumber:
          type: string
          maxLength: 20
          nullable: true
          description: Unique among the dealership's active vehicles (else 400 VALIDATION on stockNumber)
        listPrice:
          type: number
          minimum: 0
          nullable: true
          description: At most 2 decimals

    FuelType:
      type: string
      enum: [GASOLINE, DIESEL, HYBRID, PLUGIN_HYBRID, ELECTRIC, OTHER]

    PaymentMethod:
      type: string
      enum: [CASH, DEBIT, CREDIT_CARD, CHEQUE, BANK_TRANSFER, FINANCING, OTHER]

    PaymentCreate:
      type: object
      required: [amount, method, paidOn]
      properties:
        amount: { type: number, minimum: 0.01, description: "At most 2 decimals; not more than the balance due" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidOn: { type: string, format: date, description: "Between the sold date and today" }
        note: { type: string, maxLength: 200, nullable: true }

    PaymentLedger:
      type: object
      required: [soldPrice, paidTotal, balanceDue, items]
      properties:
        soldPrice: { type: number, nullable: true }
        paidTotal: { type: number }
        balanceDue: { type: number, nullable: true, description: "soldPrice − paidTotal; null while in stock" }
        items:
          type: array
          description: Newest paidOn first
          items:
            type: object
            required: [id, amount, method, paidOn, recordedBy, createdAt]
            properties:
              id: { type: integer, format: int64 }
              amount: { type: number }
              method: { $ref: "#/components/schemas/PaymentMethod" }
              paidOn: { type: string, format: date }
              note: { type: string, nullable: true }
              recordedBy: { type: string }
              createdAt: { type: string, format: date-time }

    WorkshopSettlementReport:
      type: object
      required: [openCount, inProgressCount, doneCount, settledCost, months, assignees]
      properties:
        openCount: { type: integer }
        inProgressCount: { type: integer }
        doneCount: { type: integer }
        settledCost: { type: number, description: Sum of done work-order costs }
        months:
          type: array
          description: Twelve most recent completion months, newest first
          items:
            type: object
            required: [month, doneCount, settledCost]
            properties:
              month: { type: string, example: "2026-10" }
              doneCount: { type: integer }
              settledCost: { type: number }
        assignees:
          type: array
          description: Highest settled cost first; cancelled work orders are not counted
          items:
            type: object
            required: [assigneeUsername, outstandingCount, doneCount, settledCost]
            properties:
              assigneeUsername: { type: string, nullable: true, description: null for unassigned work orders }
              outstandingCount: { type: integer, description: OPEN plus IN_PROGRESS }
              doneCount: { type: integer }
              settledCost: { type: number }

    PublicInventory:
      type: object
      required: [dealerId, legalName, contactPhone, contactEmail, contactAddress, vehicles]
      properties:
        dealerId: { type: integer, format: int64 }
        legalName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        contactAddress: { type: string }
        vehicles:
          type: array
          description: In-stock vehicles whose ad is READY with a passed current check, newest addedOn first. No VIN, cost, list price, or customer data
          items:
            type: object
            required: [vehicleId, modelYear, make, model, bodyType, conditionCode, title, body, hasPhoto]
            properties:
              vehicleId: { type: integer, format: int64 }
              modelYear: { type: integer }
              make: { type: string }
              model: { type: string }
              bodyType: { $ref: "#/components/schemas/VehicleBodyType" }
              conditionCode: { $ref: "#/components/schemas/ConditionCode" }
              mileageKm: { type: integer, nullable: true }
              exteriorColor: { type: string, nullable: true }
              fuelType:
                allOf: [{ $ref: "#/components/schemas/FuelType" }]
                nullable: true
              title: { type: string }
              body: { type: string }
              hasPhoto: { type: boolean }

    Inquiry:
      type: object
      required: [vehicleId, contact, message]
      properties:
        vehicleId: { type: integer, format: int64 }
        contact: { $ref: "#/components/schemas/CustomerWrite" }
        message: { type: string, minLength: 1, maxLength: 1000 }

    VehicleSell:
      type: object
      required: [version]
      description: "`soldOn` and `soldPrice` are a required pair: either missing, or `soldPrice` ≤ 0 → 400 `SOLD_PAIR_REQUIRED`."
      properties:
        soldOn:
          type: string
          format: date
          description: Not in the future and not before `addedOn`
        soldPrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        version:
          type: integer
          format: int64

    PageVehicle:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Vehicle"

    LinkedVehicleSummary:
      type: object
      description: One CRM table column. If several vehicles, use the latest linkedAt. Null when unlinked.
      required: [id, modelYear, make, model]
      properties:
        id:
          type: integer
          format: int64
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string

    LinkedVehicleDetail:
      type: object
      required: [id, vin, modelYear, make, model, status]
      properties:
        id:
          type: integer
          format: int64
        vin:
          type: string
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"

    CustomerListItem:
      type: object
      required: [id, name, email, phone, homeAddress, version]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        homeAddress:
          type: string
        linkedVehicle:
          allOf:
            - $ref: "#/components/schemas/LinkedVehicleSummary"
          nullable: true
        linkedVehicleCount:
          type: integer
          description: Number of vehicles linked to this customer (CRM list "vehicles purchased" count)
        version:
          type: integer
          format: int64

    Customer:
      type: object
      required: [id, name, email, phone, homeAddress, linkedVehicles, version]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        homeAddress:
          type: string
        linkedVehicles:
          type: array
          items:
            $ref: "#/components/schemas/LinkedVehicleDetail"
        version:
          type: integer
          format: int64
        emailWarning:
          type: string
          description: Present only on a create or update response when another customer of this dealership already uses the email. The save still succeeded (CRM-13).

    MyJoinRequest:
      type: object
      required: [dealerId]
      properties:
        dealerId:
          type: integer
          format: int64
        legalName:
          type: string
          nullable: true

    CustomerWrite:
      type: object
      required: [name, email, phone, homeAddress]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
          pattern: "^(?=(?:\\D*\\d){7,20}\\D*$)[0-9+\\-() ]+$"
          description: 7-20 digits; only digits, '+', '-', '(', ')' and spaces
        homeAddress:
          type: string
          maxLength: 300

    CustomerPatch:
      type: object
      required: [version, name, email, phone, homeAddress]
      description: Full replacement with the same rules as create.
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
          pattern: "^(?=(?:\\D*\\d){7,20}\\D*$)[0-9+\\-() ]+$"
          description: 7-20 digits; only digits, '+', '-', '(', ')' and spaces
        homeAddress:
          type: string
          maxLength: 300

    PageCustomerListItem:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CustomerListItem"

    CustomerVehicleLink:
      type: object
      required: [id, customerId, vehicleId, linkedAt]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        vehicleId:
          type: integer
          format: int64
        linkedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC

    RuleFinding:
      type: object
      required: [ruleId, severity, passed, message]
      properties:
        ruleId:
          type: string
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        passed:
          type: boolean
        message:
          type: string

    AiNote:
      type: object
      required: [code, severity, explanation, message]
      description: Structured model note. Rule findings are a separate object and are not given these issue codes.
      properties:
        code:
          type: string
          description: Short issue identifier, such as MISLEADING_CLAIM or CLEAR
        severity:
          type: string
          enum: [REVIEW, INFO]
        explanation:
          type: string
          description: Why the note was raised
        message:
          type: string
          description: Human-readable note

    Check:
      type: object
      required:
        - id
        - listingId
        - contentVersion
        - ruleFindings
        - aiStatus
        - recommendation
        - checkStatus
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        contentVersion:
          type: integer
          format: int64
        ruleFindings:
          type: array
          items:
            $ref: "#/components/schemas/RuleFinding"
        aiStatus:
          $ref: "#/components/schemas/AiStatus"
        aiNotes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AiNote"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
        createdAt:
          type: string
          format: date-time

    Listing:
      type: object
      required:
        - vehicleId
        - title
        - body
        - adKind
        - medium
        - status
        - contentVersion
        - checkStatus
        - version
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Null for a virtual empty draft
        vehicleId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"
        priorUse:
          $ref: "#/components/schemas/ListingPriorUse"
        warrantyTerms:
          type: string
          nullable: true
          description: Extended warranty terms recorded in the salesperson checklist; null when no warranty is offered
        annualKmAllowance:
          type: integer
          nullable: true
          description: Lease annual kilometre allowance recorded in the salesperson checklist
        status:
          $ref: "#/components/schemas/ListingStatus"
        contentVersion:
          type: integer
          format: int64
        lastCheckId:
          type: integer
          format: int64
          nullable: true
        lastCheck:
          allOf:
            - $ref: "#/components/schemas/Check"
          nullable: true
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
        version:
          type: integer
          format: int64

    ListingPatch:
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: May omit or send 0 on first save
        title:
          type: string
          maxLength: 200
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"
        priorUse:
          $ref: "#/components/schemas/ListingPriorUse"
        warrantyTerms:
          type: string
          nullable: true
          maxLength: 2000
        annualKmAllowance:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000000
      description: |
        `title`, `body`, `adKind` and `medium` follow merge-patch semantics on a later save.
        The salesperson checklist answers (`priorUse`, `warrantyTerms`, `annualKmAllowance`) are
        sent on every save and are replaced as a unit: an omitted or `null` answer clears it.
        Changing any answer invalidates a previous check, like a copy edit.

    ListingPriorUse:
      type: string
      nullable: true
      enum: [POLICE_EMERGENCY, TAXI_LIMO, DAILY_RENTAL, OTHER, null]
      description: Previous use declared in the salesperson checklist; null when not applicable or unknown

    ListingVersionBody:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: listing optimistic lock

    AuditEvent:
      type: object
      required: [id, entityType, entityId, action, actorUsername, createdAt]
      properties:
        id:
          type: integer
          format: int64
        entityType:
          $ref: "#/components/schemas/AuditEntityType"
        entityId:
          type: integer
          format: int64
        action:
          $ref: "#/components/schemas/AuditAction"
        fieldSummary:
          type: object
          additionalProperties: true
          description: No full customer phone/email/home address. Link/unlink only {customerId,vehicleId}
        actorUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    PageAuditEvent:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"

    PendingUser:
      type: object
      required: [username, displayName, email, phone, createdAt]
      properties:
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PagePendingUser:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PendingUser"

    WorkOrderStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, DONE, CANCELLED]

    WorkOrder:
      type: object
      required: [id, vehicleId, task, status, createdAt, version]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        task: { type: string, maxLength: 200 }
        assigneeUsername: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/WorkOrderStatus"
        dueOn: { type: string, format: date, nullable: true }
        cost: { type: number, nullable: true }
        completionNote: { type: string, nullable: true, maxLength: 500 }
        completedOn: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        version: { type: integer }

    WorkOrderCreate:
      type: object
      required: [task]
      properties:
        task: { type: string, minLength: 1, maxLength: 200 }
        assigneeUsername: { type: string, nullable: true, maxLength: 64 }
        dueOn: { type: string, format: date, nullable: true }

    WorkOrderPatch:
      type: object
      required: [status, task, version]
      properties:
        status:
          $ref: "#/components/schemas/WorkOrderStatus"
        task: { type: string, minLength: 1, maxLength: 200 }
        assigneeUsername: { type: string, nullable: true, maxLength: 64 }
        dueOn: { type: string, format: date, nullable: true }
        cost: { type: number, minimum: 0, nullable: true, description: Read only when status is DONE }
        completionNote: { type: string, nullable: true, maxLength: 500, description: Required when status is DONE }
        version: { type: integer }

    PhotoPreset:
      type: string
      enum: [AUTO, BRIGHTEN, SHARPEN]
      description: AUTO = contrast stretch (1st–99th luminance percentile); BRIGHTEN = gamma 0.8; SHARPEN = 3x3 kernel.

    Photo:
      type: object
      required: [id, vehicleId, contentType, uploadedBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        enhancement:
          allOf:
            - $ref: "#/components/schemas/PhotoPreset"
          nullable: true
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }

    LeadStage:
      type: string
      enum: [NEW, CONTACTED, QUALIFIED, WON, LOST]

    FunnelStageCount:
      type: object
      required: [stage, count, percentOfTotal]
      properties:
        stage: { $ref: "#/components/schemas/LeadStage" }
        count: { type: integer, format: int64 }
        percentOfTotal: { type: number, format: decimal }

    SalesFunnelReport:
      type: object
      required: [totalLeads, openLeads, stages, wonRatePercent, months]
      properties:
        totalLeads: { type: integer, format: int64 }
        openLeads: { type: integer, format: int64, description: "NEW, CONTACTED or QUALIFIED" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/FunnelStageCount" }
        wonRatePercent: { type: number, format: decimal, description: "WON ÷ (WON + LOST); 0 when no lead is closed" }
        months:
          type: array
          description: Stage history (CRM-16) from LEAD audit rows; twelve most recent UTC months with a lead create or stage change, newest first
          items:
            type: object
            required: [month, stages]
            properties:
              month: { type: string, example: "2026-10" }
              stages:
                type: array
                description: Leads that entered each stage that month
                items: { $ref: "#/components/schemas/FunnelStageCount" }

    SalesReport:
      type: object
      required: [soldCount, revenue, grossProfit, averageDaysToSell, inStockCount, inventoryCost, months]
      properties:
        soldCount: { type: integer }
        revenue: { type: number, format: decimal, description: Sum of sold prices }
        grossProfit: { type: number, format: decimal, description: Sold price minus purchase and repair cost }
        averageDaysToSell: { type: number, format: decimal, nullable: true, description: soldOn minus addedOn; null with no sales }
        inStockCount: { type: integer }
        inventoryCost: { type: number, format: decimal, description: Purchase plus repair cost of in-stock vehicles }
        months:
          type: array
          description: Twelve most recent months with a sale, newest first
          items:
            type: object
            required: [month, soldCount, revenue, grossProfit]
            properties:
              month: { type: string, example: "2026-10" }
              soldCount: { type: integer }
              revenue: { type: number, format: decimal }
              grossProfit: { type: number, format: decimal }

    LeadVehicle:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        vin: { type: string }
        modelYear: { type: integer }
        make: { type: string }
        model: { type: string }
        status:
          $ref: "#/components/schemas/VehicleStatus"

    LeadListItem:
      type: object
      required: [id, customerId, customerName, stage, overdue, version]
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        vehicle:
          $ref: "#/components/schemas/LeadVehicle"
        stage:
          $ref: "#/components/schemas/LeadStage"
        ownerUsername: { type: string, nullable: true }
        nextFollowUpOn: { type: string, format: date, nullable: true }
        overdue: { type: boolean }
        version: { type: integer }

    PageLeadListItem:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LeadListItem"

    LeadNote:
      type: object
      required: [id, authorUsername, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        authorUsername: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    LeadDetail:
      allOf:
        - $ref: "#/components/schemas/LeadListItem"
        - type: object
          required: [notes, createdAt]
          properties:
            lostReason: { type: string, nullable: true }
            notes:
              type: array
              items:
                $ref: "#/components/schemas/LeadNote"
            createdAt: { type: string, format: date-time }

    LeadCreate:
      type: object
      description: Exactly one of customerId or newCustomer.
      properties:
        customerId: { type: integer, format: int64, nullable: true }
        newCustomer:
          $ref: "#/components/schemas/CustomerWrite"
        vehicleId: { type: integer, format: int64, nullable: true }
        ownerUsername: { type: string, nullable: true, maxLength: 64 }
        nextFollowUpOn: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true, maxLength: 2000 }

    LeadPatch:
      type: object
      required: [stage, version]
      properties:
        stage:
          $ref: "#/components/schemas/LeadStage"
        ownerUsername: { type: string, nullable: true, maxLength: 64 }
        nextFollowUpOn: { type: string, format: date, nullable: true }
        vehicleId: { type: integer, format: int64, nullable: true }
        lostReason: { type: string, nullable: true, maxLength: 300 }
        version: { type: integer }

    AssistantAsk:
      type: object
      required: [text]
      properties:
        text:
          type: string

    AssistantCard:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          $ref: "#/components/schemas/AssistantCardKind"
        id:
          type: integer
          format: int64
        label:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"
          description: VEHICLE cards only (14 example)
        vehicleId:
          type: integer
          format: int64
          description: LISTING cards only (14 example)
        checkStatus:
          $ref: "#/components/schemas/CheckStatus"
          description: LISTING cards only (14 example)

    AssistantAnswer:
      type: object
      required: [summaryAvailable, cards]
      properties:
        summary:
          type: string
          nullable: true
        summaryAvailable:
          type: boolean
        cards:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AssistantCard"
        count:
          type: object
          nullable: true
          description: Present when the question asks how many; the number is computed by core, not by the model
          required: [count, singularLabel, pluralLabel, summary]
          properties:
            count: { type: integer }
            singularLabel: { type: string }
            pluralLabel: { type: string }
            summary: { type: string, example: "There are 2 in-stock vehicles." }

    VehiclePublic:
      type: object
      description: For internal checks. No purchase/repair/sold price.
      required: [modelYear, make, model, vin, conditionCode, source]
      properties:
        modelYear:
          type: integer
        make:
          type: string
        model:
          type: string
        vin:
          type: string
        conditionCode:
          $ref: "#/components/schemas/ConditionCode"
        source:
          $ref: "#/components/schemas/VehicleSource"

    DealerPublic:
      type: object
      required: [legalName, contactPhone, contactEmail, contactAddress]
      properties:
        legalName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        contactAddress:
          type: string

    InternalListingSlice:
      type: object
      required: [title, body, adKind, medium]
      properties:
        title:
          type: string
        body:
          type: string
        adKind:
          $ref: "#/components/schemas/AdKind"
        medium:
          $ref: "#/components/schemas/AdMedium"

    InternalAdCheckRequest:
      type: object
      required: [listing, vehiclePublic, dealerPublic]
      properties:
        listing:
          $ref: "#/components/schemas/InternalListingSlice"
        vehiclePublic:
          $ref: "#/components/schemas/VehiclePublic"
        dealerPublic:
          $ref: "#/components/schemas/DealerPublic"

    InternalAdCheckOk:
      type: object
      required: [success, notes]
      description: |
        PROTOCOL §B.2 success. `success` must be `true`. `notes` may be `[]`; each element is `{code, severity, explanation, message}`.
        core writes `notes` as-is onto public `Check.aiNotes`. Ban `recommendation` / `checkStatus` / `ruleFindings`.
      properties:
        success:
          type: boolean
          enum: [true]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/AiNote"

    InternalAssistantOk:
      type: object
      required: [success, summary]
      description: |
        PROTOCOL §B.3 success. `application/json`, not `text/plain`. `summary` is short and non-empty.
      properties:
        success:
          type: boolean
          enum: [true]
        summary:
          type: string
          minLength: 1

    InternalAiFailure:
      type: object
      required: [success, code, message]
      description: |
        PROTOCOL §B.2–B.3 unified failure for both internal AI paths. `success` must be `false`.
        HTTP and `code` table: 504 `AI_TIMEOUT`, 503 `AI_KEY_MISSING`, 502 `AI_PROVIDER_FAILED`.
        These codes are **not** public `/api/v1` ErrorCode values.
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [AI_TIMEOUT, AI_KEY_MISSING, AI_PROVIDER_FAILED]
        message:
          type: string

    InternalAssistantResource:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          $ref: "#/components/schemas/AssistantCardKind"
        id:
          type: integer
          format: int64
        label:
          type: string
        status:
          $ref: "#/components/schemas/VehicleStatus"

    InternalAssistantRequest:
      type: object
      required: [question, resources]
      properties:
        question:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/InternalAssistantResource"
