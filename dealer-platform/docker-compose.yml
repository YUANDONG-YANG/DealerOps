services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dealer_core
      MYSQL_USER: dealer
      MYSQL_PASSWORD: dealer_dev_only
      MYSQL_ROOT_PASSWORD: dealer_root_dev_only
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
