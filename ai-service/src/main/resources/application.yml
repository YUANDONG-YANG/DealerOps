# Keep this file named application.yml. The aimanager dependency jar ships its own
# classpath application.yml (name ai-gateway, default profile full, port 8080); this file
# shadows it, while an application.yaml here would be loaded alongside it and lose.
server:
  port: ${AI_PORT:8082}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ai-service}

dealerops:
  # Release time. deploy/terraform/deploy-apps.sh stamps PUBLISHED_AT on every Azure deploy;
  # when it is unset, the Maven build time is used (design/20-Observability.md).
  published-at: ${PUBLISHED_AT:}
  # Relative to the process working directory. Run configurations use the repo root,
  # so all services share one log-sum/ folder. Set LOG_DIR to override per environment.
  log-dir: ${LOG_DIR:log-sum}
  ai:
    connect-timeout-ms: 2000
    response-timeout-ms: 13000
    timeout-ms: 15000
    require-internal-header: true
  internal-header-name: X-Dealer-Internal
  internal-token: ${INTERNAL_TOKEN:dealer-internal}

aimanager:
  api-key: ${AIMANAGER_API_KEY:}
  gateway-provider: ${AIMANAGER_GATEWAY_PROVIDER:groq}
  gateway-model: ${AIMANAGER_GATEWAY_MODEL:qwen/qwen3.8-27b}
  gateway-max-tokens: ${AIMANAGER_GATEWAY_MAX_TOKENS:800}

management:
  endpoints:
    web:
      exposure:
        # info carries the release time that the gateway /actuator/release reads.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
