<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 450" width="1150" height="450" role="img" aria-label="Customers (CRM): creating a customer and linking a vehicle. Duplicates warn but never block; one vehicle belongs to one customer">
  <rect width="1150" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="32" font-size="17" font-weight="700" fill="#0f172a">Customers (CRM): creating a customer and linking a vehicle</text>
    <text x="30" y="54" font-size="11.5" fill="#64748b">Duplicates warn but never block; one vehicle belongs to one customer</text>
    <rect x="20" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="80.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Enter customer</text>
    <text x="80.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">name, email, phone</text>
    <text x="80.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">home address</text>
    <polygon points="245.0,196 315,230.0 245.0,264 175,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="245.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Any field used</text>
    <text x="245.0" y="241.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">before?</text>
    <rect x="185" y="310" width="120" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="245.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Warning shown</text>
    <text x="245.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">user confirms</text>
    <rect x="350" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="410.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Save customer</text>
    <text x="410.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">audit row written</text>
    <rect x="515" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="575.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Link a vehicle</text>
    <text x="575.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">same dealership</text>
    <polygon points="740.0,196 810,230.0 740.0,264 670,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="740.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Already</text>
    <text x="740.0" y="241.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">linked?</text>
    <rect x="680" y="90" width="120" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="740.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">VEHICLE_ALREADY</text>
    <text x="740.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">_LINKED</text>
    <rect x="845" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="905.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Linked</text>
    <text x="905.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">history row kept</text>
    <polygon points="1070.0,196 1140,230.0 1070.0,264 1000,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="1070.0" y="234.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Vehicle sold?</text>
    <rect x="1010" y="310" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1070.0" y="344.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Link locked</text>
    <rect x="1010" y="90" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1070.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">May unlink</text>
    <text x="1070.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">row is kept</text>
    <path d="M140,230.0 H175" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="146" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M315,230.0 H350" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="321" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M245.0,264 V310" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="253.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M305,340.0 H410.0 V260" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="311" y="333.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M470,230.0 H515" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="476" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M635,230.0 H670" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="641" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M740.0,196 V150" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb)"/>
    <text x="748.0" y="184" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M810,230.0 H845" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="816" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M965,230.0 H1000" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="971" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M1070.0,264 V310" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="1078.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M1070.0,196 V150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="1078.0" y="184" font-size="10.5" fill="#334155" text-anchor="start">No</text>
  </g>
</svg>
