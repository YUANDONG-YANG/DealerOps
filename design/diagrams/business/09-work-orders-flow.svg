<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 450" width="1150" height="450" role="img" aria-label="Work orders: reconditioning a vehicle before sale. The cost of a finished task becomes part of the vehicle repair cost">
  <rect width="1150" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="32" font-size="17" font-weight="700" fill="#0f172a">Work orders: reconditioning a vehicle before sale</text>
    <text x="30" y="54" font-size="11.5" fill="#64748b">The cost of a finished task becomes part of the vehicle repair cost</text>
    <rect x="20" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="80.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Create task</text>
    <text x="80.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">in-stock vehicle</text>
    <text x="80.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">assignee, due date</text>
    <polygon points="245.0,196 315,230.0 245.0,264 175,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="245.0" y="234.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Vehicle sold?</text>
    <rect x="185" y="310" width="120" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="245.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Refused</text>
    <text x="245.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">no tasks after sale</text>
    <rect x="350" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="410.0" y="234.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">OPEN</text>
    <rect x="515" y="200" width="120" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="575.0" y="234.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">IN_PROGRESS</text>
    <polygon points="740.0,196 810,230.0 740.0,264 670,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="740.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Note and cost</text>
    <text x="740.0" y="241.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">given?</text>
    <rect x="680" y="310" width="120" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="740.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Field message</text>
    <text x="740.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">fix and retry</text>
    <rect x="845" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="905.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">DONE</text>
    <text x="905.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">cost added to</text>
    <text x="905.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">repair cost</text>
    <rect x="515" y="90" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="575.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">CANCELLED</text>
    <text x="575.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">kept in history</text>
    <rect x="1010" y="200" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1070.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Sale allowed</text>
    <text x="1070.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">only with no</text>
    <text x="1070.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">open tasks</text>
    <path d="M140,230.0 H175" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="146" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M315,230.0 H350" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="321" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M245.0,264 V310" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb)"/>
    <text x="253.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M470,230.0 H515" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="476" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M635,230.0 H670" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="641" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">finish</text>
    <path d="M810,230.0 H845" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="816" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M740.0,264 V310" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb)"/>
    <text x="748.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M575.0,200 V150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="583.0" y="184" font-size="10.5" fill="#334155" text-anchor="start">cancel</text>
    <path d="M965,230.0 H1010" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="971" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
  </g>
</svg>
