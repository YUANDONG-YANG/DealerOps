<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 450" width="1150" height="450" role="img" aria-label="Buyer site: an inquiry becomes a tracked lead. The public sees only listed vehicles; every inquiry is audited as buyer-site">
  <rect width="1150" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="32" font-size="17" font-weight="700" fill="#0f172a">Buyer site: an inquiry becomes a tracked lead</text>
    <text x="30" y="54" font-size="11.5" fill="#64748b">The public sees only listed vehicles; every inquiry is audited as buyer-site</text>
    <rect x="20" y="200" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="80.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Visitor browses</text>
    <text x="80.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">/shop/dealership</text>
    <rect x="185" y="200" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="245.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Sends inquiry</text>
    <text x="245.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">name, phone,</text>
    <text x="245.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">message</text>
    <polygon points="410.0,196 480,230.0 410.0,264 340,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="410.0" y="234.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Still listed?</text>
    <rect x="350" y="310" width="120" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="410.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Not listed any</text>
    <text x="410.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">more, no inquiry</text>
    <rect x="515" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="575.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Match customer</text>
    <text x="575.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">name + phone,</text>
    <text x="575.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">else create one</text>
    <polygon points="740.0,196 810,230.0 740.0,264 670,230.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="740.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Open lead on</text>
    <text x="740.0" y="241.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">this car?</text>
    <rect x="680" y="90" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="740.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Inquiry added</text>
    <text x="740.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">as a note</text>
    <rect x="845" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="905.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">New lead NEW</text>
    <text x="905.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">inbox message</text>
    <text x="905.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">posted</text>
    <rect x="1010" y="200" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="1070.0" y="219.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Staff take it</text>
    <text x="1070.0" y="234.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">owner or stage set</text>
    <text x="1070.0" y="249.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">message clears</text>
    <rect x="1010" y="310" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1070.0" y="329.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Sold elsewhere:</text>
    <text x="1070.0" y="344.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">lead closed,</text>
    <text x="1070.0" y="359.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">message cleared</text>
    <path d="M140,230.0 H185" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="146" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M305,230.0 H340" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="311" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M480,230.0 H515" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="486" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M410.0,264 V310" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb)"/>
    <text x="418.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M635,230.0 H670" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="641" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M740.0,196 V150" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="748.0" y="184" font-size="10.5" fill="#334155" text-anchor="start">Yes</text>
    <path d="M810,230.0 H845" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="816" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">No</text>
    <path d="M965,230.0 H1010" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="971" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M1070.0,260 V310" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="1078.0" y="280" font-size="10.5" fill="#334155" text-anchor="start"></text>
  </g>
</svg>
