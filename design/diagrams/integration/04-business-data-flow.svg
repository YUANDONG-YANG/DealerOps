<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img"
     aria-label="DealerOps business data flow: actors, business modules, the tables each module writes, and the append-only audit trail.">
  <rect x="0" y="0" width="1200" height="960" fill="#ffffff"/>
