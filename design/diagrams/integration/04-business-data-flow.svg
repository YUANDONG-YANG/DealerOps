    <text x="40" y="1000" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Side effects of Sell on other modules: closes the vehicle's open leads (buyer Won, others Lost), clears their inbox messages, links the buyer customer, locks purchase fields, takes the ad off the buyer site.</text>
