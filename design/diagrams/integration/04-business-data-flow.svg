    <text x="105.0" y="743.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dealership staff</text>
    <text x="105.0" y="760.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">same people, next stage</text>
