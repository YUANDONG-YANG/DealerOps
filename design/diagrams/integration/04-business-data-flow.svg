    <text x="1080.0" y="444" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">dealership name (snapshot)</text>
    <text x="1080.0" y="461" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">new and previous values</text>
    <text x="1080.0" y="478" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">client IP and location</text>
    <text x="1080.0" y="495" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">same transaction as the change</text>
    <text x="1080.0" y="512" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read by Owner, Manager, Admin</text>
