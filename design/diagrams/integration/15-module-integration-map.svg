    <text x="245.0" y="344.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Dashboard</text>
    <text x="245.0" y="359.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">read-only</text>
    <rect x="680" y="310" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="740.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Customers (CRM)</text>
    <text x="740.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">profile, vehicles</text>
    <rect x="1010" y="310" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="1070.0" y="336.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Payments</text>
    <text x="1070.0" y="351.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">ledger, bill of sale</text>
    <rect x="350" y="420" width="120" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="410.0" y="439.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Audit trail</text>
    <text x="410.0" y="454.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">every write: one row</text>
    <text x="410.0" y="469.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">read by Owner, Admin</text>
    <path d="M140,120.0 H185" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="146" y="113.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M140,230.0 H185" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="146" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">tasks</text>
    <path d="M305,230.0 H350" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="311" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M470,230.0 H515" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="476" y="223.0" font-size="10.5" fill="#334155" text-anchor="start"></text>
    <path d="M635,230.0 H680" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="641" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">listed</text>
    <path d="M800,230.0 H845" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="806" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">lead</text>
    <path d="M965,230.0 H1010" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="971" y="223.0" font-size="10.5" fill="#334155" text-anchor="start">settled</text>
    <path d="M1070.0,260 V310" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="1078.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">price = balance</text>
    <path d="M575.0,150 V200" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="583.0" y="170" font-size="10.5" fill="#334155" text-anchor="start">rules</text>
    <path d="M740.0,150 V200" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="748.0" y="170" font-size="10.5" fill="#334155" text-anchor="start">inquiry</text>
    <path d="M740.0,260 V310" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="748.0" y="280" font-size="10.5" fill="#334155" text-anchor="start">buyer</text>
    <path d="M800,340.0 H905.0 V260" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ma)"/>
    <text x="806" y="333.0" font-size="10.5" fill="#334155" text-anchor="start">customer</text>
    <path d="M1070,200 V175 H770 V200" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mg)"/>
    <text x="880" y="168" font-size="10.5" fill="#334155" text-anchor="start">sold: ad taken down</text>
    <path d="M245.0,310 V260" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="253.0" y="294" font-size="10.5" fill="#334155" text-anchor="start">reads</text>
    <path d="M410.0,420 V260" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#mg)"/>
    <text x="418.0" y="404" font-size="10.5" fill="#334155" text-anchor="start">every write</text>
  </g>
