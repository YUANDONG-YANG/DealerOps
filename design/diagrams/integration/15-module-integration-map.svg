<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" role="img" aria-label="DealerOps: all business modules connected. One vehicle journey, a public face, a customer book, shared rules and one audit trail">
  <rect width="1150" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="32" font-size="17" font-weight="700" fill="#0f172a">DealerOps: all business modules connected</text>
    <text x="30" y="54" font-size="11.5" fill="#64748b">One vehicle journey, a public face, a customer book, shared rules and one audit trail</text>
    <rect x="20" y="90" width="120" height="60" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="80.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Platform Admin</text>
    <text x="80.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">opens dealerships</text>
    <rect x="185" y="90" width="120" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="245.0" y="109.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Team and access</text>
    <text x="245.0" y="124.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Owner approves,</text>
    <text x="245.0" y="139.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Manager supervises</text>
    <rect x="515" y="90" width="120" height="60" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="575.0" y="109.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">OMVIC rules</text>
    <text x="575.0" y="124.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Admin settings,</text>
    <text x="575.0" y="139.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Owner profile</text>
    <rect x="680" y="90" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="740.0" y="116.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Public visitor</text>
    <text x="740.0" y="131.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">no account</text>
    <rect x="20" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="80.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Inventory</text>
    <text x="80.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">VIN, source, cost</text>
    <rect x="185" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="245.0" y="226.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Work orders</text>
    <text x="245.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">cost to repair</text>
    <rect x="350" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
