    <text x="410.0" y="241.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">photos</text>
    <rect x="515" y="200" width="120" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
