# Compile only. The cloud deploy uploads dist/ to Azure Static Web Apps (deploy/README.md).
name: dealer-web
on:
  pull_request:
    paths:
      - "dealer-web/**"
      - ".github/workflows/dealer-web.yml"
  push:
    branches: [main]
    paths:
      - "dealer-web/**"
      - ".github/workflows/dealer-web.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dealer-web

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dealer-web/package-lock.json
      - run: echo "repo=${{ github.repository }}"
      - run: npm ci
      - run: npm run build
