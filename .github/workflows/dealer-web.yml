# In-repo copy of dealer-web CI (design/AI-CODING-LOCAL-AND-CLOUD.md §7).
name: dealer-web
on:
  pull_request:
    paths:
      - "dealer-web/**"
      - ".github/workflows/dealer-web.yml"
  push:
    branches: [main]
    paths:
      - "dealer-web/**"
      - ".github/workflows/dealer-web.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dealer-web

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dealer-web/package-lock.json
      - run: echo "repo=${{ github.repository }}"
      - run: npm ci
      - run: npm run build

  image:
    if: github.ref == 'refs/heads/main'
    needs: compile
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7
      - run: echo "build-and-push ${{ github.sha }}"
      # docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/dealer-web:${{ github.sha }} dealer-web
