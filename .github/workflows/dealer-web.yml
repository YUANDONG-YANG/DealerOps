# Build the active React app. Cloud deploy uploads dist/ to the Linux App Service (deploy/README.md).
name: dealer-web
on:
  pull_request:
    paths:
      - "frontend/react/**"
      - ".github/workflows/dealer-web.yml"
  push:
    branches: [main]
    paths:
      - "frontend/react/**"
      - ".github/workflows/dealer-web.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend/react

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - run: echo "repo=${{ github.repository }}"
      - run: npm ci
      - run: npm run build
