# dealer-platform does not build business images (design/AI-CODING-LOCAL-AND-CLOUD.md §7).
# Validates Bicep only. This job does not deploy. The Bicep file is the Azure backup draft.
# The current public demo is the Cloudflare quick tunnel in deploy/README.md.
name: dealer-platform
on:
  pull_request:
    paths:
      - "dealer-platform/infra/**"
      - "dealer-platform/pipelines/**"
      - ".github/workflows/dealer-platform.yml"
  push:
    branches: [main]
    paths:
      - "dealer-platform/infra/**"
      - "dealer-platform/pipelines/**"
      - ".github/workflows/dealer-platform.yml"
  workflow_dispatch:

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      # checkout@v7 and azure/cli@v3 run on Node 24. azure/cli@v2 (v2.2.0) still declares Node 20.
      # This script only compiles Bicep. It does not log in or deploy.
      - uses: actions/checkout@v7
      - uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az bicep install
            az bicep build --file dealer-platform/infra/main.bicep --stdout > /dev/null
            echo "Bicep compiled. Not deployed (no subscription / no secret values in repo)."
