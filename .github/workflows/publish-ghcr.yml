# Builds and pushes the four app images to GHCR. Compile stays in the per-app workflows.
# Does not start the Cloudflare quick tunnel and does not deploy the Azure backup.
# Procedure: deploy/README.md
name: publish-ghcr
on:
  push:
    branches: [main]
    paths:
      - "dealer-web/**"
      - "dealer-core/**"
      - "dealer-gateway/**"
      - "ai-service/**"
      - "dealer-platform/docker-compose.yml"
      - "dealer-platform/docker-compose.ghcr.yml"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp publish time
        id: stamp
        run: echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push images
        env:
          PUBLISHED_AT: ${{ steps.stamp.outputs.published_at }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "PUBLISHED_AT=${PUBLISHED_AT}"
          publish() {
            local name="$1"
            local context="$2"
            shift 2
            local sha_ref="ghcr.io/yuandong-yang/${name}:${IMAGE_SHA}"
            local main_ref="ghcr.io/yuandong-yang/${name}:main"
            docker build \
              --label "org.opencontainers.image.source=https://github.com/YUANDONG-YANG/DealerOps" \
              --label "org.opencontainers.image.revision=${IMAGE_SHA}" \
              --label "org.opencontainers.image.created=${PUBLISHED_AT}" \
              "$@" \
              -t "${sha_ref}" \
              -t "${main_ref}" \
              "${context}"
            docker push "${sha_ref}"
            docker push "${main_ref}"
            echo "Image ${sha_ref}"
            echo "Image ${main_ref}"
          }
          publish dealer-web dealer-web --build-arg "VITE_PUBLISHED_AT=${PUBLISHED_AT}"
          publish dealer-core dealer-core --build-arg "PUBLISHED_AT=${PUBLISHED_AT}"
          publish dealer-gateway dealer-gateway
          publish ai-service ai-service
          echo "Published ${PUBLISHED_AT}"
          {
            echo "### GHCR publish"
            echo "Published ${PUBLISHED_AT}"
            echo ""
            echo "- ghcr.io/yuandong-yang/dealer-web:${IMAGE_SHA}"
            echo "- ghcr.io/yuandong-yang/dealer-web:main"
            echo "- ghcr.io/yuandong-yang/dealer-core:${IMAGE_SHA}"
            echo "- ghcr.io/yuandong-yang/dealer-core:main"
            echo "- ghcr.io/yuandong-yang/dealer-gateway:${IMAGE_SHA}"
            echo "- ghcr.io/yuandong-yang/dealer-gateway:main"
            echo "- ghcr.io/yuandong-yang/ai-service:${IMAGE_SHA}"
            echo "- ghcr.io/yuandong-yang/ai-service:main"
          } >> "$GITHUB_STEP_SUMMARY"
