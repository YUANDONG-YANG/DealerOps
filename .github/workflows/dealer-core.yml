# Compile and test only. Image publish is .github/workflows/publish-ghcr.yml (see deploy/README.md).
# If the course later splits four git remotes, copy this file to that repo as .github/workflows/ci.yml
# and set working-directory to ".".
name: dealer-core
on:
  pull_request:
    paths:
      - "dealer-core/**"
      - ".github/workflows/dealer-core.yml"
  push:
    branches: [main]
    paths:
      - "dealer-core/**"
      - ".github/workflows/dealer-core.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dealer-core

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - run: mvn -B -DskipTests compile
      - name: Unit tests
        run: mvn -B test
      - name: Integration tests (Testcontainers MySQL 8.4)
        if: success()
        run: |
          if docker info >/dev/null 2>&1; then
            mvn -B -DJWT_MODE=dev verify
          else
            echo "Docker is not available; skipping *IT (Flyway V1 on mysql:8.4)."
          fi
