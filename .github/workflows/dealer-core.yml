# Build the active .NET 10 dealer-core project. Cloud deploy is an operator step (deploy/README.md).
name: dealer-core
on:
  pull_request:
    paths:
      - "backend/dotnet/DealerOps.Core/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - "backend/dotnet/DealerOps.Core.sln"
      - ".github/workflows/dealer-core.yml"
  push:
    branches: [main]
    paths:
      - "backend/dotnet/DealerOps.Core/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - "backend/dotnet/DealerOps.Core.sln"
      - ".github/workflows/dealer-core.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: echo "repo=${{ github.repository }}"
      - run: dotnet build backend/dotnet/DealerOps.Core/DealerOps.Core.csproj --nologo
