# In-repo copy of dealer-core CI (design/AI-CODING-LOCAL-AND-CLOUD.md §7).
# If the course later splits four git remotes, copy this file to that repo as .github/workflows/ci.yml
# and set working-directory to ".".
name: dealer-core
on:
  pull_request:
    paths:
      - "dealer-core/**"
      - ".github/workflows/dealer-core.yml"
  push:
    branches: [main]
    paths:
      - "dealer-core/**"
      - ".github/workflows/dealer-core.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dealer-core

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - run: mvn -B -DskipTests compile
      - name: Unit tests
        run: mvn -B test
      - name: Integration tests (Testcontainers MySQL 8.4)
        if: success()
        run: |
          if docker info >/dev/null 2>&1; then
            mvn -B verify -DskipTests
          else
            echo "Docker is not available; skipping *IT (Flyway V1 on mysql:8.4)."
          fi

  image:
    if: github.ref == 'refs/heads/main'
    needs: compile
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7
      - run: echo "build-and-push ${{ github.sha }}"
      # docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/dealer-core:${{ github.sha }} dealer-core
      # ACR name: ${prefix}acr (example dealeropsacr). Login via GitHub Secrets, never commit keys.
      # Optional extra: Flyway job against Key Vault MYSQL-* after Azure permissions exist.
