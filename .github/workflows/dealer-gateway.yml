# Build the active .NET 10 gateway. Cloud deploy is an operator step (deploy/README.md).
name: dealer-gateway
on:
  pull_request:
    paths:
      - "backend/dotnet/DealerOps.Gateway/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - ".github/workflows/dealer-gateway.yml"
  push:
    branches: [main]
    paths:
      - "backend/dotnet/DealerOps.Gateway/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - ".github/workflows/dealer-gateway.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: echo "repo=${{ github.repository }}"
      - run: dotnet build backend/dotnet/DealerOps.Gateway/DealerOps.Gateway.csproj --nologo
