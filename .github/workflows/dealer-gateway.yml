# Compile and test only. Image publish is .github/workflows/publish-ghcr.yml (see deploy/README.md).
name: dealer-gateway
on:
  pull_request:
    paths:
      - "dealer-gateway/**"
      - ".github/workflows/dealer-gateway.yml"
  push:
    branches: [main]
    paths:
      - "dealer-gateway/**"
      - ".github/workflows/dealer-gateway.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dealer-gateway

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - run: mvn -B -DskipTests compile
      - name: Unit tests
        run: mvn -B test
