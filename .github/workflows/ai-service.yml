# Compile and test only (stub profile). Image publish is .github/workflows/publish-ghcr.yml (see deploy/README.md).
# Stub only: never call a paid model. The published image uses the same stub Maven profile.
name: ai-service
on:
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-service

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - name: Compile with AI stub
        run: mvn -B -Pstub,!aimanager -Daimanager.stub=true -DskipTests compile
      - name: Unit tests (stub, no paid model)
        run: mvn -B -Pstub,!aimanager -Daimanager.stub=true test
        env:
          AIMANAGER_API_KEY: ""