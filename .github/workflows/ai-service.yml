# Build the active .NET 10 AI service. Cloud deploy is an operator step (deploy/README.md).
name: ai-service
on:
  pull_request:
    paths:
      - "backend/dotnet/DealerOps.AiService/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - ".github/workflows/ai-service.yml"
  push:
    branches: [main]
    paths:
      - "backend/dotnet/DealerOps.AiService/**"
      - "backend/dotnet/DealerOps.Logging/**"
      - ".github/workflows/ai-service.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: echo "repo=${{ github.repository }}"
      - run: dotnet build backend/dotnet/DealerOps.AiService/DealerOps.AiService.csproj --nologo
