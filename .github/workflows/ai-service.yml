# Compile only. The cloud deploy is a JAR upload run by an operator (deploy/README.md).
name: ai-service
on:
  pull_request:
    paths:
      - "backend/java/ai-service/**"
      - ".github/workflows/ai-service.yml"
  push:
    branches: [main]
    paths:
      - "backend/java/ai-service/**"
      - ".github/workflows/ai-service.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend/java/ai-service

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - name: Compile with the vendored ai-manager sources
        run: mvn -B -DskipTests compile
