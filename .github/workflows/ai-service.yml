# Compile only. The cloud deploy is a JAR upload run by an operator (deploy/README.md).
name: ai-service
on:
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-service

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: echo "repo=${{ github.repository }}"
      - name: Install pinned ai-manager dependency
        uses: actions/checkout@v7
        with:
          repository: YUANDONG-YANG/ai-manager
          ref: 827196a
          path: ai-manager
      - name: Build ai-manager with Java 17
        working-directory: ai-manager
        run: mvn -B -DskipTests install
      - name: Compile with the real AI dependency
        run: mvn -B -DskipTests compile
