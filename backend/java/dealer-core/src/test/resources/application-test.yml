# ITs use Flyway V1 on MySQL (Testcontainers or compose). No in-memory schema and no ddl-auto create/update.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: api://dealer-api

dealerops:
  gateway-base-url: http://127.0.0.1:9
  internal-token: dealer-internal
  jwt:
    mode: dev
    dev-secret: dealer-dev-jwt-secret-change-me
