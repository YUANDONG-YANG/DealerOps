server:
  port: ${CORE_PORT:8081}

spring:
  main:
    web-application-type: servlet
  application:
    name: dealer-core
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dealer_core?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:dealer}
    password: ${MYSQL_PASSWORD:dealer_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # V1 uses TINYINT / TIMESTAMP; keep ddl-auto=validate aligned with Flyway.
      hibernate.type.preferred_boolean_jdbc_type: TINYINT
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER:https://login.microsoftonline.com/<tenant-id>/v2.0}
          audiences: ${ENTRA_AUDIENCE:api://dealer-api}

dealerops:
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  internal-token: ${INTERNAL_TOKEN:dealer-internal}
  ai-timeout-ms: 15000
  ai:
    connect-timeout-ms: 2000
    response-timeout-ms: 13000
  jwt:
    # entra: use ENTRA_ISSUER JWKS. Placeholder issuer <tenant-id> falls back to local HS256.
    mode: ${JWT_MODE:dev}
    # Local HS256 only; not a production secret. Must be at least 32 bytes.
    dev-secret: ${DEV_JWT_SECRET:dealer-dev-jwt-secret-change-me}
