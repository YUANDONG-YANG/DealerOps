server:
  port: ${CORE_PORT:8081}
  # Gateway forwards the browser Host and proto so Swagger links stay on the gateway.
  forward-headers-strategy: framework

spring:
  main:
    web-application-type: servlet
  application:
    name: dealer-core
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dealer_core?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:dealer}
    password: ${MYSQL_PASSWORD:dealer_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # V1 uses TINYINT / TIMESTAMP; keep ddl-auto=validate aligned with Flyway.
      hibernate.type.preferred_boolean_jdbc_type: TINYINT
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

dealerops:
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  # Browser origin for OpenAPI "servers". Separate from gateway-base-url, which core uses to call the gateway.
  public-gateway-url: ${GATEWAY_PUBLIC_URL:http://localhost:8080}
  internal-token: ${INTERNAL_TOKEN:dealer-internal}
  ai-timeout-ms: 15000
  ai:
    connect-timeout-ms: 2000
    response-timeout-ms: 13000
  # Set by the GHCR image (publish workflow). Local runs stay "local".
  published-at: ${PUBLISHED_AT:local}
  jwt:
    # dealer-core issues and validates its own HS256 tokens at /api/v1/auth/login (no Entra).
    # DEV_JWT_SECRET must be at least 32 bytes in any non-local environment.
    dev-secret: ${DEV_JWT_SECRET:dealer-dev-jwt-secret-change-me}
