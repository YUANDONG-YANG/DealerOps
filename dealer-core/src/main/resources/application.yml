server:
  port: ${CORE_PORT:8081}
  # Gateway forwards the browser Host and proto so Swagger links stay on the gateway.
  forward-headers-strategy: framework

spring:
  main:
    web-application-type: servlet
  application:
    name: dealer-core
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dealer_core?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:dealer}
    password: ${MYSQL_PASSWORD:dealer_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # V1 uses TINYINT / TIMESTAMP; keep ddl-auto=validate aligned with Flyway.
      hibernate.type.preferred_boolean_jdbc_type: TINYINT
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        # info carries the release time that the gateway /actuator/release reads.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

dealerops:
  # Relative to the process working directory. Run configurations use the repo root,
  # so all services share one log-sum/ folder. Set LOG_DIR to override per environment.
  log-dir: ${LOG_DIR:log-sum}
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  # Browser origin for OpenAPI "servers". Separate from gateway-base-url.
  public-gateway-url: ${GATEWAY_PUBLIC_URL:http://localhost:8080}
  # Core calls ai-service directly; do not point this at the gateway.
  ai-base-url: ${AI_BASE_URL:http://127.0.0.1:8082}
  internal-token: ${INTERNAL_TOKEN:dealer-internal}
  ai-timeout-ms: 15000
  # Free NHTSA vPIC catalog (no key) for the DMS make/model filter options.
  vpic:
    base-url: ${VPIC_BASE_URL:https://vpic.nhtsa.dot.gov/api/vehicles}
  ai:
    connect-timeout-ms: 2000
    response-timeout-ms: 13000
  # Release time. deploy/terraform/deploy-apps.sh stamps PUBLISHED_AT on every Azure deploy;
  # when it is unset, the Maven build time is used (design/20-Observability.md).
  published-at: ${PUBLISHED_AT:}
  jwt:
    # dealer-core issues and validates its own HS256 tokens at /api/v1/auth/login.
    # DEV_JWT_SECRET must be at least 32 bytes in any non-local environment.
    dev-secret: ${DEV_JWT_SECRET:dealer-dev-jwt-secret-change-me}
