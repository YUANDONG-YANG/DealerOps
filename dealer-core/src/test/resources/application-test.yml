spring:
  datasource:
    url: jdbc:h2:mem:dealer_core;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
          audiences: api://dealer-api

dealerops:
  gateway-base-url: http://127.0.0.1:9
  internal-token: dealer-internal
  jwt:
    mode: dev
    dev-secret: dealer-dev-jwt-secret-change-me
